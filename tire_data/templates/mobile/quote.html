{% extends "mobile/base.html" %}

{% block title %}견적서 - TirePASS{% endblock %}
{% block header_title %}고객 제안 견적{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 20px; font-size: 18px; font-weight: 600;">견적서 작성</h2>

    <div class="form-group">
        <label class="form-label">상품 선택</label>
        <input type="text" class="form-input" id="searchProduct" placeholder="상품명 또는 코드로 검색">
        <div id="searchResults" style="max-height: 200px; overflow-y: auto; border: 1px solid #e5e7eb; border-radius: 8px; margin-top: 10px; display: none;"></div>
    </div>

    <div id="selectedProduct" style="display: none;">
        <div class="form-group">
            <label class="form-label">선택한 상품</label>
            <div style="padding: 15px; background-color: #f9fafb; border-radius: 8px;">
                <div style="font-weight: 600; margin-bottom: 5px;" id="productName"></div>
                <div style="font-size: 13px; color: #6b7280;" id="productInfo"></div>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">제조년도 (DOT)</label>
            <select class="form-input" id="selectedYear">
                <option value="">선택 안함</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">수량</label>
            <input type="number" class="form-input" id="quantity" value="4" min="1">
        </div>

        <div class="form-group">
            <label class="form-label">마진율 (%)</label>
            <input type="number" class="form-input" id="marginRate" value="15" min="0" max="100" step="0.1">
            <div style="font-size: 13px; color: #6b7280; margin-top: 5px;">
                기본값: <span id="defaultMargin">15</span>%
            </div>
        </div>

        <button onclick="calculateQuote()" class="btn btn-primary btn-block">견적 계산하기</button>
    </div>
</div>

<div id="quoteResult" style="display: none;"></div>
{% endblock %}

{% block extra_js %}
<script>
let selectedProductCode = null;
let customerDefaultMargin = 15;

// 고객 기본 마진율 로드
async function loadCustomerMargin() {
    const customerCode = getCustomerCode();
    if (!customerCode) return;

    try {
        const response = await fetch(`/api/mobile/auth/profile/?customer_code=${customerCode}`);
        const data = await response.json();
        if (data.success && data.data.default_margin) {
            customerDefaultMargin = parseFloat(data.data.default_margin);
            document.getElementById('marginRate').value = customerDefaultMargin;
            document.getElementById('defaultMargin').textContent = customerDefaultMargin;
        }
    } catch (error) {
        console.error('마진율 로드 실패:', error);
    }
}

// 상품 검색
let searchTimeout;
document.getElementById('searchProduct').addEventListener('input', async (e) => {
    clearTimeout(searchTimeout);
    const query = e.target.value.trim();

    if (query.length < 2) {
        document.getElementById('searchResults').style.display = 'none';
        return;
    }

    searchTimeout = setTimeout(async () => {
        try {
            const response = await fetch(`/api/mobile/products/?search=${query}&page_size=10`);
            const data = await response.json();

            if (data.success && data.data.products.length > 0) {
                renderSearchResults(data.data.products);
            } else {
                document.getElementById('searchResults').innerHTML = '<div style="padding: 15px; text-align: center; color: #6b7280;">검색 결과가 없습니다</div>';
                document.getElementById('searchResults').style.display = 'block';
            }
        } catch (error) {
            console.error('검색 실패:', error);
        }
    }, 300);
});

function renderSearchResults(products) {
    const container = document.getElementById('searchResults');
    container.innerHTML = products.map(product => `
        <div style="padding: 15px; border-bottom: 1px solid #e5e7eb; cursor: pointer;" onclick="selectProduct('${product.code}')">
            <div style="font-weight: 600; margin-bottom: 5px;">${product.name}</div>
            <div style="font-size: 13px; color: #6b7280;">${product.brand || ''} • ${product.code} • 재고: ${product.stock}</div>
        </div>
    `).join('');
    container.style.display = 'block';
}

async function selectProduct(code) {
    selectedProductCode = code;
    const customerCode = getCustomerCode();

    showLoading();

    try {
        const response = await fetch(`/api/mobile/products/${code}/?customer_code=${customerCode}`);
        const data = await response.json();
        hideLoading();

        if (data.success) {
            displaySelectedProduct(data.data);
            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('selectedProduct').style.display = 'block';
        }
    } catch (error) {
        hideLoading();
        showAlert('상품 로드 실패', 'error');
    }
}

function displaySelectedProduct(product) {
    document.getElementById('productName').textContent = product.name;
    document.getElementById('productInfo').textContent = `${product.brand || ''} • ${product.code}`;

    // 제조년도 옵션
    const yearSelect = document.getElementById('selectedYear');
    if (product.price_info.available_years && product.price_info.available_years.length > 0) {
        yearSelect.innerHTML = '<option value="">선택 안함</option>' +
            product.price_info.available_years.map(year => `
                <option value="${year.year}">
                    ${year.year}년 (재고: ${year.quantity}개${year.discount > 0 ? `, -${year.discount}%` : ''})
                </option>
            `).join('');
    } else {
        yearSelect.innerHTML = '<option value="">선택 안함</option>';
    }
}

async function calculateQuote() {
    const customerCode = getCustomerCode();
    const quantity = parseInt(document.getElementById('quantity').value);
    const marginRate = parseFloat(document.getElementById('marginRate').value);
    const selectedYearEl = document.getElementById('selectedYear');
    const selectedYear = selectedYearEl.value || null;

    if (!selectedProductCode) {
        showAlert('상품을 선택해주세요', 'error');
        return;
    }

    showLoading();

    try {
        const params = new URLSearchParams({
            product_code: selectedProductCode,
            customer_code: customerCode,
            quantity: quantity,
            margin_rate: marginRate
        });

        if (selectedYear) {
            params.append('selected_year', selectedYear);
        }

        const response = await fetch(`/api/mobile/calculate-quote/?${params}`);
        const data = await response.json();
        hideLoading();

        if (data.success) {
            renderQuoteResult(data.data);
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('계산 중 오류가 발생했습니다', 'error');
    }
}

function renderQuoteResult(data) {
    const container = document.getElementById('quoteResult');

    const html = `
        <div class="card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
            <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 15px;">고객 제안가</h3>
            <div style="font-size: 32px; font-weight: 700; margin-bottom: 10px;">
                ${data.quote.quote_total.toLocaleString()}원
            </div>
            <div style="font-size: 14px; opacity: 0.9;">
                단가: ${data.quote.quote_price.toLocaleString()}원 × ${data.product.quantity}개
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 15px;">상품 정보</h3>
            <table style="width: 100%; font-size: 14px;">
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 10px 0; color: #6b7280;">상품명</td>
                    <td style="padding: 10px 0; font-weight: 500;">${data.product.name}</td>
                </tr>
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 10px 0; color: #6b7280;">브랜드</td>
                    <td style="padding: 10px 0; font-weight: 500;">${data.product.brand || '-'}</td>
                </tr>
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 10px 0; color: #6b7280;">수량</td>
                    <td style="padding: 10px 0; font-weight: 500;">${data.product.quantity}개</td>
                </tr>
                ${data.product.selected_year ? `
                <tr>
                    <td style="padding: 10px 0; color: #6b7280;">제조년도</td>
                    <td style="padding: 10px 0; font-weight: 500;">${data.product.selected_year}년</td>
                </tr>
                ` : ''}
            </table>
        </div>

        <div class="card">
            <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 15px;">가격 상세</h3>

            <div style="padding: 15px; background-color: #f9fafb; border-radius: 8px; margin-bottom: 15px;">
                <div style="font-size: 14px; font-weight: 600; color: #374151; margin-bottom: 10px;">💰 매입 정보</div>
                <table style="width: 100%; font-size: 14px;">
                    <tr>
                        <td style="padding: 5px 0; color: #6b7280;">정가 (단가)</td>
                        <td style="padding: 5px 0; text-align: right;">${data.purchase.unit_price.toLocaleString()}원</td>
                    </tr>
                    <tr>
                        <td style="padding: 5px 0; color: #6b7280;">할인율</td>
                        <td style="padding: 5px 0; text-align: right; color: #dc2626; font-weight: 600;">-${data.purchase.discount_rate.toFixed(1)}%</td>
                    </tr>
                    <tr style="border-top: 1px solid #e5e7eb; font-weight: 600;">
                        <td style="padding: 10px 0; color: #374151;">매입 단가</td>
                        <td style="padding: 10px 0; text-align: right; color: #2563eb;">${data.purchase.purchase_price.toLocaleString()}원</td>
                    </tr>
                    <tr style="font-weight: 600;">
                        <td style="padding: 5px 0; color: #374151;">매입 총액</td>
                        <td style="padding: 5px 0; text-align: right; color: #2563eb;">${data.purchase.purchase_total.toLocaleString()}원</td>
                    </tr>
                </table>
            </div>

            <div style="padding: 15px; background-color: #f0fdf4; border-radius: 8px;">
                <div style="font-size: 14px; font-weight: 600; color: #065f46; margin-bottom: 10px;">💵 판매 정보 (제안가)</div>
                <table style="width: 100%; font-size: 14px;">
                    <tr>
                        <td style="padding: 5px 0; color: #6b7280;">매입 단가</td>
                        <td style="padding: 5px 0; text-align: right;">${data.purchase.purchase_price.toLocaleString()}원</td>
                    </tr>
                    <tr>
                        <td style="padding: 5px 0; color: #6b7280;">마진율</td>
                        <td style="padding: 5px 0; text-align: right; color: #059669; font-weight: 600;">+${data.quote.margin_rate}%</td>
                    </tr>
                    <tr>
                        <td style="padding: 5px 0; color: #6b7280;">마진 금액</td>
                        <td style="padding: 5px 0; text-align: right; color: #059669; font-weight: 600;">+${data.quote.margin_amount.toLocaleString()}원</td>
                    </tr>
                    <tr style="border-top: 1px solid #bbf7d0; font-weight: 600;">
                        <td style="padding: 10px 0; color: #065f46;">제안 단가</td>
                        <td style="padding: 10px 0; text-align: right; color: #059669; font-size: 16px;">${data.quote.quote_price.toLocaleString()}원</td>
                    </tr>
                    <tr style="font-weight: 700;">
                        <td style="padding: 5px 0; color: #065f46; font-size: 16px;">제안 총액</td>
                        <td style="padding: 5px 0; text-align: right; color: #059669; font-size: 18px;">${data.quote.quote_total.toLocaleString()}원</td>
                    </tr>
                    <tr>
                        <td style="padding: 5px 0; color: #065f46; font-size: 14px;">총 마진</td>
                        <td style="padding: 5px 0; text-align: right; color: #059669; font-size: 14px;">+${data.quote.margin_total.toLocaleString()}원</td>
                    </tr>
                </table>
            </div>
        </div>

        <div class="card">
            <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 15px;">할인 상세</h3>
            <table style="width: 100%; font-size: 13px;">
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 8px 0; color: #6b7280;">기본 할인</td>
                    <td style="padding: 8px 0; text-align: right; font-weight: 500;">${data.discount_detail.basic_discount}%</td>
                </tr>
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 8px 0; color: #6b7280;">고객 할인</td>
                    <td style="padding: 8px 0; text-align: right; font-weight: 500;">${data.discount_detail.customer_discount}%</td>
                </tr>
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 8px 0; color: #6b7280;">추가 할인</td>
                    <td style="padding: 8px 0; text-align: right; font-weight: 500;">${data.discount_detail.additional_discount}%</td>
                </tr>
                <tr>
                    <td style="padding: 8px 0; color: #6b7280;">DOT 할인</td>
                    <td style="padding: 8px 0; text-align: right; font-weight: 500;">${data.discount_detail.dot_discount}%</td>
                </tr>
            </table>
        </div>

        <button onclick="window.print()" class="btn btn-secondary btn-block">견적서 인쇄</button>
    `;

    container.innerHTML = html;
    container.style.display = 'block';

    // 스크롤
    container.scrollIntoView({ behavior: 'smooth' });
}

// 초기화
loadCustomerMargin();
</script>

<style>
@media print {
    .header, .bottom-nav, button { display: none !important; }
    .main-content { margin-top: 0 !important; padding: 20px !important; }
}
</style>
{% endblock %}
