{% extends "mobile/base.html" %}

{% block title %}상품검색 - TirePASS{% endblock %}
{% block header_title %}상품검색{% endblock %}
{% block nav_products %}active{% endblock %}

{% block content %}
<!-- 검색 필터 -->
<div class="card">
    <div style="display: flex; gap: 10px; margin-bottom: 0;">
        <input type="text" class="form-input" id="searchInput" placeholder="상품명, 코드 또는 숫자로 검색 (예: 2055516)" style="flex: 1;">
        <button class="btn btn-primary" onclick="performSearch()" style="padding: 12px 20px; white-space: nowrap;">
            🔍 검색
        </button>
    </div>
    <div style="font-size: 12px; color: #6b7280; margin-top: 8px;">
        💡 팁: 타이어 사이즈를 숫자로만 입력해도 검색됩니다 (예: 2055516 → 205/55R16)
    </div>
</div>

<div class="card">
    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <label style="display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="tireOnly" checked> 타이어만 보기
        </label>
        <label style="display: flex; align-items: center; gap: 5px;">
            <input type="checkbox" id="inStockOnly" checked> 재고 있는 상품만
        </label>
    </div>
</div>

<!-- 상품 목록 -->
<div id="productsList"></div>

<!-- 페이징 -->
<div id="pagination" style="display: flex; justify-content: center; gap: 10px; margin-top: 20px;"></div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
let totalPages = 1;
let searchQuery = '';
let selectedBrands = '';

async function loadProducts(page = 1) {
    const customerCode = getCustomerCode();
    if (!customerCode) {
        location.href = '/mobile/login/';
        return;
    }

    const tireOnly = document.getElementById('tireOnly').checked ? 1 : 0;
    const inStock = document.getElementById('inStockOnly').checked ? 1 : 0;

    showLoading();

    try {
        const params = new URLSearchParams({
            page: page,
            page_size: 10,
            tire_only: tireOnly,
            in_stock: inStock,
            search: searchQuery
        });

        // 다중 브랜드 필터 추가
        if (selectedBrands) {
            params.append('brands', selectedBrands);
        }

        const response = await fetch(`/api/mobile/products/?${params}`);
        const data = await response.json();
        hideLoading();

        if (data.success) {
            currentPage = data.data.page;
            totalPages = data.data.total_pages;
            renderProducts(data.data.products);
            renderPagination();
        } else {
            showAlert('상품 로드 실패', 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('오류가 발생했습니다', 'error');
    }
}

// 타이어 사이즈 추출 함수
function extractTireSize(name) {
    const sizeMatch = name.match(/(\d{3}\/\d{2}R?\d{2})/i);
    return sizeMatch ? sizeMatch[1] : '';
}

// 브랜드 로고 경로 생성
function getBrandLogo(brand) {
    if (!brand) return '';
    const brandLower = brand.toLowerCase().replace(/\s+/g, '');
    return `/static/mobile/img/brands/${brandLower}.png`;
}

function renderProducts(products) {
    const container = document.getElementById('productsList');

    if (products.length === 0) {
        container.innerHTML = '<div class="card"><p style="text-align: center; color: #6b7280;">검색 결과가 없습니다.</p></div>';
        return;
    }

    container.innerHTML = products.map(product => {
        const tireSize = extractTireSize(product.name);
        const discount = product.discount_rate || 0;
        const originalPrice = product.price || 0;
        const discountedPrice = discount > 0 ? Math.round(originalPrice * (1 - discount / 100)) : originalPrice;
        const brandLogo = getBrandLogo(product.brand);

        // DOT 재고 카드 색상 매핑
        const dotColors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444'];  // 파랑, 초록, 주황, 빨강

        return `
        <div class="card" id="card-${product.code}" style="position: relative; padding: 20px; border: 2px solid #e5e7eb; border-radius: 12px; margin-bottom: 15px;">
            <!-- 브랜드 로고 -->
            <div style="position: absolute; top: 15px; right: 15px; width: 100px; height: 60px;">
                ${product.brand ? `<img src="${brandLogo}" alt="${product.brand}" style="max-width: 100%; max-height: 100%; object-fit: contain;" onerror="this.style.display='none'">` : ''}
            </div>

            <!-- 상단 태그 버튼들 (성능 표기) -->
            <div style="display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;">
                ${product.brand ? `<span style="padding: 6px 14px; border: 2px solid #000; border-radius: 6px; font-size: 13px; font-weight: 600; background: white;">${product.brand}</span>` : ''}
                ${product.performance_tags && product.performance_tags.length > 0
                    ? product.performance_tags.map(tag => `<span style="padding: 6px 14px; border: 2px solid #000; border-radius: 6px; font-size: 13px; font-weight: 600; background: white;">${tag.tag}</span>`).join('')
                    : ''}
            </div>

            <!-- 상품명 -->
            <div style="margin-bottom: 15px; padding-right: 110px;">
                <h3 style="font-size: 22px; font-weight: 800; margin-bottom: 10px; line-height: 1.3;">
                    ${tireSize || ''}
                </h3>
                <div style="font-size: 15px; color: #374151; line-height: 1.4;">
                    ${product.name}
                </div>
            </div>

            <!-- DOT 재고 확인 버튼 -->
            <button onclick="event.stopPropagation(); toggleDOTInfo('${product.code}')"
                    id="dot-btn-${product.code}"
                    style="width: 100%; padding: 12px; margin-bottom: 15px; background: #fff; border: 2px solid #38bdf8; color: #0284c7; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;">
                📦 DOT 재고 확인
            </button>

            <!-- DOT 재고 정보 (토글) -->
            <div id="dot-info-${product.code}" style="display: none; margin-bottom: 15px;">
                ${product.dot_inventory && product.dot_inventory.length > 0 ? `
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">
                        ${product.dot_inventory.map((dot, index) => `
                            <div style="border: 2px solid ${dotColors[index % 4]}; border-radius: 8px; padding: 12px; background: white;">
                                <div style="font-size: 16px; font-weight: 700; color: #000; margin-bottom: 8px;">${dot.year}</div>
                                <div style="font-size: 13px; color: #6b7280; margin-bottom: 4px;">재고 ${dot.stock}개</div>
                                <div style="font-size: 13px; color: #6b7280; margin-bottom: 8px;">할인 ${dot.discount}%</div>
                                <div style="font-size: 18px; font-weight: 700; color: #ef4444;">₩${dot.price.toLocaleString()}</div>
                            </div>
                        `).join('')}
                    </div>
                ` : '<p style="text-align: center; color: #6b7280; padding: 10px;">DOT 재고 정보가 없습니다.</p>'}
            </div>

            <!-- 가격 정보 -->
            <div style="margin-bottom: 15px;">
                <!-- 공장도가 -->
                ${originalPrice > 0 ? `
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 8px;">
                    <span style="font-size: 14px; color: #6b7280;">공장도가</span>
                    <span style="font-size: 16px; color: #9ca3af; text-decoration: line-through;">₩${originalPrice.toLocaleString()}</span>
                    ${discount > 0 ? `<span style="background: #dc2626; color: white; padding: 4px 12px; border-radius: 4px; font-size: 14px; font-weight: 700;">${discount}% OFF</span>` : ''}
                </div>
                ` : ''}

                <!-- 공급가 -->
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px;">
                    <span style="font-size: 14px; color: #6b7280;">공급가</span>
                    <span style="font-size: 28px; font-weight: 800; color: #000;">₩${discountedPrice.toLocaleString()}</span>
                </div>
            </div>

            <!-- 재고 -->
            <div style="display: inline-block; background: #16a34a; color: white; padding: 8px 16px; border-radius: 6px; font-size: 15px; font-weight: 600; margin-bottom: 15px;">
                재고: ${product.stock || 0}개
            </div>

            <!-- 장바구니 / 구매하기 버튼 -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <button onclick="event.stopPropagation(); addToCart('${product.code}')"
                        style="padding: 16px; background: #2563eb; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px;">
                    🛒
                </button>
                <button onclick="event.stopPropagation(); buyNow('${product.code}')"
                        style="padding: 16px; background: #fbbf24; color: #000; border: none; border-radius: 8px; font-size: 18px; font-weight: 700; cursor: pointer;">
                    구매하기
                </button>
            </div>
        </div>
        `;
    }).join('');
}

// DOT 재고 정보 토글
function toggleDOTInfo(code) {
    const dotInfo = document.getElementById(`dot-info-${code}`);
    const dotBtn = document.getElementById(`dot-btn-${code}`);

    if (dotInfo.style.display === 'none') {
        dotInfo.style.display = 'block';
        dotBtn.textContent = '📦 DOT 재고 닫기';
        dotBtn.style.background = '#38bdf8';
        dotBtn.style.color = 'white';
    } else {
        dotInfo.style.display = 'none';
        dotBtn.textContent = '📦 DOT 재고 확인';
        dotBtn.style.background = '#fff';
        dotBtn.style.color = '#0284c7';
    }
}

// 장바구니 담기
function addToCart(code) {
    showAlert('장바구니에 담겼습니다.', 'success');
    // TODO: 실제 장바구니 API 연동
}

// 바로 구매
function buyNow(code) {
    location.href = `/mobile/products/${code}/`;
}

function renderPagination() {
    const container = document.getElementById('pagination');
    const pages = [];

    if (currentPage > 1) {
        pages.push(`<button class="btn btn-secondary" onclick="loadProducts(${currentPage - 1})">이전</button>`);
    }

    pages.push(`<span style="padding: 12px; color: #6b7280;">${currentPage} / ${totalPages}</span>`);

    if (currentPage < totalPages) {
        pages.push(`<button class="btn btn-secondary" onclick="loadProducts(${currentPage + 1})">다음</button>`);
    }

    container.innerHTML = pages.join('');
}

function viewDetail(code) {
    location.href = `/mobile/products/${code}/`;
}

// 검색 함수
function performSearch() {
    searchQuery = document.getElementById('searchInput').value.trim();
    loadProducts(1);
}

// Enter 키로 검색
document.getElementById('searchInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        performSearch();
    }
});

// 실시간 검색 (타이핑 중)
let searchTimeout;
document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        searchQuery = e.target.value.trim();
        if (searchQuery.length >= 3 || searchQuery.length === 0) {
            loadProducts(1);
        }
    }, 500);
});

// 필터 변경
document.getElementById('tireOnly').addEventListener('change', () => loadProducts(1));
document.getElementById('inStockOnly').addEventListener('change', () => loadProducts(1));

// URL에서 검색 파라미터 읽기
function initFromURL() {
    const urlParams = new URLSearchParams(window.location.search);

    // 검색어
    const searchParam = urlParams.get('search');
    if (searchParam) {
        searchQuery = searchParam;
        document.getElementById('searchInput').value = searchParam;
    }

    // 브랜드 필터
    const brandsParam = urlParams.get('brands');
    if (brandsParam) {
        selectedBrands = brandsParam;
    }

    // 타이어만 보기 필터
    const tireOnlyParam = urlParams.get('tire_only');
    if (tireOnlyParam === '1') {
        document.getElementById('tireOnly').checked = true;
    }
}

// 초기화 및 로드
initFromURL();
loadProducts(1);
</script>
{% endblock %}
