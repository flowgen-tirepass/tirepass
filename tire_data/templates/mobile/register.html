{% extends "mobile/base.html" %}

{% block title %}회원가입 - TirePASS{% endblock %}
{% block header_title %}회원가입{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom: 30px; text-align: center; color: #2563eb;">신규 회원가입</h2>

    <form id="registerForm" autocomplete="off">
        <div class="form-group">
            <label class="form-label">사업자등록번호 *</label>
            <input type="text" class="form-input" id="enno" name="bizreg" placeholder="123-45-67890 또는 TEST001" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required maxlength="12">
            <p style="font-size: 12px; color: #6b7280; margin-top: 5px;">10자리 숫자 또는 TEST001 형식</p>
        </div>

        <div class="form-group">
            <label class="form-label">상호 *</label>
            <input type="text" class="form-input" id="name" name="shopname" placeholder="예: 홍길동타이어" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>
        </div>

        <div class="form-group">
            <label class="form-label">비밀번호 *</label>
            <input type="password" class="form-input" id="password" name="newpass" placeholder="최소 4자 이상" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required minlength="4">
        </div>

        <div class="form-group">
            <label class="form-label">비밀번호 확인 *</label>
            <input type="password" class="form-input" id="password_confirm" name="confirmpass" placeholder="비밀번호 재입력" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>
        </div>

        <div class="form-group">
            <label class="form-label">대표자</label>
            <input type="text" class="form-input" id="rep" name="repname" placeholder="대표자명" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
        </div>

        <div class="form-group">
            <label class="form-label">전화번호</label>
            <input type="tel" class="form-input" id="tel1" name="phone1" placeholder="예: 02-1234-5678" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
        </div>

        <div class="form-group">
            <label class="form-label">휴대전화</label>
            <input type="tel" class="form-input" id="tel3" name="phone2" placeholder="예: 010-1234-5678" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');">
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 30px;">가입하기</button>
    </form>

    <div style="margin-top: 20px; text-align: center;">
        <p style="color: #6b7280; margin-bottom: 10px;">이미 회원이신가요?</p>
        <a href="/mobile/login/" class="btn btn-secondary btn-block">로그인</a>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = document.getElementById('password').value;
    const password_confirm = document.getElementById('password_confirm').value;

    if (password !== password_confirm) {
        showAlert('비밀번호가 일치하지 않습니다.', 'error');
        return;
    }

    const formData = {
        name: document.getElementById('name').value,
        password: password,
        rep: document.getElementById('rep').value,
        tel1: document.getElementById('tel1').value,
        tel3: document.getElementById('tel3').value,
        enno: document.getElementById('enno').value
    };

    showLoading();

    try {
        const response = await fetch('/api/mobile/auth/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            // 고객 코드 저장 (결제 수단 등록 페이지에서 사용)
            setCustomerCode(data.data.customer_code);

            showAlert(`회원가입 성공! 결제 수단을 등록해주세요.`, 'success');
            setTimeout(() => {
                location.href = '/mobile/register/payment/';
            }, 1500);
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('회원가입 중 오류가 발생했습니다.', 'error');
    }
});
</script>
{% endblock %}
