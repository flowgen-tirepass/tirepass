<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저장소 초기화 - TirePASS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
            line-height: 1.6;
        }

        .status.info {
            background: #e3f2fd;
            color: #1565c0;
            border: 1px solid #90caf9;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #81c784;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #e57373;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #666;
        }

        #log {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
            text-align: left;
            display: none;
        }

        .log-item {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>저장소 초기화</h1>

        <div id="status" class="status info">
            잘못된 고객 정보를 감지하고 수정합니다.
        </div>

        <div id="log"></div>

        <button onclick="fixStorage()" class="btn btn-primary">지금 수정하기</button>
        <button onclick="location.href='/mobile/home/'" class="btn btn-secondary">홈으로 돌아가기</button>
    </div>

    <script>
        // 로그 출력
        function addLog(message, type = 'info') {
            const log = document.getElementById('log');
            log.style.display = 'block';

            const item = document.createElement('div');
            item.className = 'log-item';
            item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(item);
            log.scrollTop = log.scrollHeight;
        }

        // 저장소 수정
        async function fixStorage() {
            const statusDiv = document.getElementById('status');
            const logDiv = document.getElementById('log');
            logDiv.innerHTML = '';
            logDiv.style.display = 'block';

            addLog('저장소 확인 시작...');

            // 1단계: 현재 localStorage 확인
            const currentName = localStorage.getItem('customer_name');
            const currentCode = localStorage.getItem('customer_code');

            addLog(`현재 customer_name: "${currentName}"`);
            addLog(`현재 customer_code: "${currentCode}"`);

            // 2단계: 잘못된 값 확인
            let needsFix = false;
            if (currentName && (
                currentName.includes('정확한') ||
                currentName.includes('입력') ||
                currentName.includes('placeholder') ||
                currentName.includes('예:') ||
                currentName.includes('고객명')
            )) {
                needsFix = true;
                addLog('⚠️ 잘못된 이름 발견!');
            }

            if (needsFix || !currentName) {
                // 3단계: localStorage 초기화
                addLog('localStorage 초기화 중...');
                localStorage.removeItem('customer_name');
                localStorage.removeItem('customer_code');
                addLog('✅ localStorage 초기화 완료');

                // 4단계: API에서 올바른 값 가져오기
                try {
                    addLog('서버에서 고객 정보 가져오는 중...');
                    const response = await fetch('/api/mobile/customer/info/', {
                        credentials: 'same-origin'  // 세션 쿠키 포함
                    });
                    const data = await response.json();

                    if (data.success && data.data) {
                        localStorage.setItem('customer_code', data.data.code);
                        localStorage.setItem('customer_name', data.data.name);

                        addLog(`✅ 올바른 이름으로 업데이트: "${data.data.name}"`);

                        statusDiv.className = 'status success';
                        statusDiv.innerHTML = `
                            <strong>✅ 수정 완료!</strong><br>
                            고객명: ${data.data.name}<br>
                            이제 홈으로 돌아가세요.
                        `;
                    } else {
                        throw new Error('고객 정보를 가져올 수 없습니다.');
                    }
                } catch (error) {
                    addLog(`❌ 오류: ${error.message}`);
                    statusDiv.className = 'status error';
                    statusDiv.innerHTML = `
                        <strong>❌ 오류 발생</strong><br>
                        ${error.message}<br>
                        <small>로그인 후 다시 시도하세요.</small>
                    `;
                }
            } else {
                addLog('✅ 이미 올바른 값이 저장되어 있습니다.');
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `
                    <strong>✅ 정상입니다!</strong><br>
                    고객명: ${currentName}<br>
                    문제가 없습니다.
                `;
            }
        }

        // 페이지 로드 시 자동 실행
        window.addEventListener('load', () => {
            // 5초 후 자동 실행
            setTimeout(() => {
                fixStorage();
            }, 1000);
        });
    </script>
</body>
</html>
