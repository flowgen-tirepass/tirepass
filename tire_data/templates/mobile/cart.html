{% extends "mobile/base.html" %}

{% block title %}장바구니 - 타이어패스{% endblock %}
{% block header_title %}장바구니{% endblock %}
{% block nav_cart %}active{% endblock %}

{% block content %}
<div id="cartList"></div>

<div class="card" id="cartSummary" style="display: none; position: sticky; bottom: 70px; background-color: white;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <span style="font-size: 18px; font-weight: 600;">총 결제금액</span>
        <span style="font-size: 24px; font-weight: 700; color: #2563eb;" id="totalPrice">0원</span>
    </div>
    <button onclick="checkout()" class="btn btn-primary btn-block">주문하기</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 페이지 로드 즉시 로그인 체크 (보안 강화)
if (!getCustomerCode()) {
    location.href = '/mobile/login/';
}

let cartItems = [];
let paymentMethods = [];
let selectedPaymentMethodId = null;

// CSRF 토큰 가져오기
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

async function loadCart() {
    const customerCode = getCustomerCode();
    if (!customerCode) {
        location.href = '/mobile/login/';
        return;
    }

    showLoading();

    try {
        const response = await fetch(`/api/mobile/cart/?customer_code=${customerCode}`);
        const data = await response.json();
        hideLoading();

        if (data.success) {
            cartItems = data.data.items;
            renderCart(data.data);
        }
    } catch (error) {
        hideLoading();
        showAlert('오류가 발생했습니다', 'error');
    }
}

function renderCart(data) {
    const container = document.getElementById('cartList');

    if (data.items.length === 0) {
        container.innerHTML = '<div class="card"><p style="text-align: center; color: #6b7280;">장바구니가 비어있습니다</p></div>';
        document.getElementById('cartSummary').style.display = 'none';
        return;
    }

    container.innerHTML = data.items.map(item => {
        // 할인율 상세 정보 HTML
        let discountDetail = '';
        if (item.total_discount_rate > 0) {
            const discounts = [];
            if (item.basic_discount_rate > 0) discounts.push(`기본 ${item.basic_discount_rate.toFixed(1)}%`);
            if (item.customer_discount_rate > 0) discounts.push(`브랜드/그룹 ${item.customer_discount_rate.toFixed(1)}%`);
            if (item.additional_discount_rate > 0) discounts.push(`추가 ${item.additional_discount_rate.toFixed(1)}%`);
            if (item.dot_discount_rate > 0) discounts.push(`DOT ${item.dot_discount_rate.toFixed(1)}%`);

            discountDetail = `
                <div style="font-size: 12px; color: #6b7280; margin-top: 5px; line-height: 1.6;">
                    <div>할인: ${discounts.join(' + ')}</div>
                    <div style="font-weight: 600; color: #dc2626;">총 ${item.total_discount_rate.toFixed(1)}% 할인</div>
                </div>
            `;
        }

        // 재고 부족 경고 (재고보다 많은 수량인 경우)
        let stockWarning = '';
        if (item.available_stock > 0 && item.quantity > item.available_stock) {
            stockWarning = `
                <div style="font-size: 12px; color: #dc2626; margin-top: 5px; padding: 5px; background-color: #fee2e2; border-radius: 4px;">
                    ⚠️ 재고 부족: 현재 재고 ${item.available_stock}개
                </div>
            `;
        }

        return `
            <div class="card">
                <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <h3 style="font-size: 16px; font-weight: 600; margin-bottom: 5px;">${item.product_name}</h3>
                        <p style="font-size: 13px; color: #6b7280;">코드: ${item.product_code}</p>
                        ${item.selected_year ? `<p style="font-size: 13px; color: #6b7280;">제조년도: ${item.selected_year}년 (재고: ${item.available_stock}개)</p>` : ''}
                    </div>
                    <button onclick="removeFromCart(${item.id})" style="background: none; border: none; font-size: 20px; cursor: pointer;">❌</button>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div style="flex: 1;">
                        <div style="font-size: 13px; color: #9ca3af; text-decoration: line-through;">
                            공장도가 ${item.unit_price.toLocaleString()}원
                        </div>
                        <div style="font-size: 18px; font-weight: 600; color: #2563eb; margin-top: 3px;">
                            공급가 ${item.discounted_price.toLocaleString()}원 × ${item.quantity}개
                        </div>
                        <div style="font-size: 16px; font-weight: 700; color: #000; margin-top: 5px;">
                            = ${item.final_price.toLocaleString()}원
                        </div>
                        ${discountDetail}
                        ${stockWarning}
                    </div>

                    <div style="display: flex; gap: 5px; align-items: center;">
                        <button onclick="updateQuantity(${item.id}, ${item.quantity - 1}, ${item.available_stock})" class="btn btn-secondary" style="padding: 5px 10px;">-</button>
                        <span style="padding: 0 10px; font-weight: 600;">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, ${item.quantity + 1}, ${item.available_stock})" class="btn btn-secondary" style="padding: 5px 10px;">+</button>
                    </div>
                </div>
            </div>
        `;
    }).join('');

    document.getElementById('totalPrice').textContent = data.total_price.toLocaleString() + '원';
    document.getElementById('cartSummary').style.display = 'block';
}

async function updateQuantity(cartId, newQuantity, availableStock) {
    if (newQuantity < 1) return;

    // 재고 확인 (수량 증가 시)
    if (availableStock > 0 && newQuantity > availableStock) {
        showAlert(`재고가 부족합니다.\n현재 재고: ${availableStock}개\n요청 수량: ${newQuantity}개`, 'error');
        return;
    }

    showLoading();

    try {
        const response = await fetch(`/api/mobile/cart/${cartId}/update/`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({quantity: newQuantity})
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            loadCart();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('오류가 발생했습니다', 'error');
    }
}

async function updateQuantityInModal(cartId, newQuantity, availableStock) {
    if (newQuantity < 1) return;

    // 재고 확인 (수량 증가 시)
    if (availableStock > 0 && newQuantity > availableStock) {
        showAlert(`재고가 부족합니다.\n현재 재고: ${availableStock}개\n요청 수량: ${newQuantity}개`, 'error');
        return;
    }

    showLoading();

    try {
        const response = await fetch(`/api/mobile/cart/${cartId}/update/`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({quantity: newQuantity})
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            // 장바구니 데이터 새로고침
            const customerCode = getCustomerCode();
            const cartResponse = await fetch(`/api/mobile/cart/?customer_code=${customerCode}`);
            const cartData = await cartResponse.json();

            if (cartData.success) {
                cartItems = cartData.data.items;

                // 모달 닫고 다시 열기
                closePaymentModal();
                showPaymentMethodModal();
            }
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('오류가 발생했습니다', 'error');
    }
}

async function removeFromCart(cartId) {
    if (!confirm('삭제하시겠습니까?')) return;

    showLoading();

    try {
        const response = await fetch(`/api/mobile/cart/${cartId}/remove/`, {
            method: 'DELETE'
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            showAlert('삭제되었습니다', 'success');
            loadCart();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('오류가 발생했습니다', 'error');
    }
}

let shippingAddresses = [];
let selectedAddressId = null;
let shippingMemo = '';

async function loadShippingAddresses() {
    const customerCode = getCustomerCode();
    if (!customerCode) return;

    try {
        const response = await fetch(`/api/mobile/shipping-addresses/?customer_code=${customerCode}`);
        const data = await response.json();

        if (data.success) {
            shippingAddresses = data.data.addresses;
            // 기본 배송지를 자동 선택
            const defaultAddress = shippingAddresses.find(addr => addr.is_default);
            if (defaultAddress) {
                selectedAddressId = defaultAddress.id;
            } else if (shippingAddresses.length > 0) {
                selectedAddressId = shippingAddresses[0].id;
            }
        }
    } catch (error) {
        console.error('배송지 목록 로드 오류:', error);
    }
}

async function checkout() {
    if (cartItems.length === 0) {
        showAlert('장바구니가 비어있습니다.', 'error');
        return;
    }

    const customerCode = getCustomerCode();
    if (!customerCode) {
        showAlert('로그인이 필요합니다.', 'error');
        location.href = '/mobile/login/';
        return;
    }

    // 배송지 선택 모달 표시
    await loadShippingAddresses();
    showAddressSelectModal();
}

function showAddressSelectModal() {
    const totalAmount = cartItems.reduce((sum, item) => sum + item.final_price, 0);

    let addressOptions = '';
    if (shippingAddresses.length === 0) {
        addressOptions = '<p style="color: #6b7280; text-align: center; padding: 20px;">등록된 배송지가 없습니다</p>';
    } else {
        addressOptions = shippingAddresses.map(addr => `
            <label style="display: block; padding: 15px; border: 2px solid ${selectedAddressId === addr.id ? '#2563eb' : '#e5e7eb'}; border-radius: 8px; margin-bottom: 10px; cursor: pointer; position: relative;">
                <input type="radio" name="address" value="${addr.id}" ${selectedAddressId === addr.id ? 'checked' : ''} onchange="selectedAddressId = ${addr.id}; updateAddressSelection();" style="margin-right: 10px;">
                <div style="display: inline-block; vertical-align: top; width: calc(100% - 80px);">
                    <div style="font-weight: 600; margin-bottom: 5px;">
                        ${addr.recipient_name} ${addr.is_default ? '<span style="background: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px;">기본</span>' : ''}
                    </div>
                    <div style="font-size: 13px; color: #6b7280; margin-bottom: 3px;">${addr.phone_number}</div>
                    <div style="font-size: 13px; color: #333;">${addr.full_address}</div>
                </div>
                <button onclick="event.stopPropagation(); editAddress(${addr.id});" style="position: absolute; top: 15px; right: 15px; background: #f3f4f6; border: 1px solid #d1d5db; color: #374151; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;">
                    변경
                </button>
            </label>
        `).join('');
    }

    const modalHtml = `
        <div id="checkoutModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.5); z-index: 1000; overflow-y: auto;">
            <div style="background: white; margin: 50px 20px; border-radius: 8px; padding: 20px; max-width: 500px; margin-left: auto; margin-right: auto;">
                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 15px;">배송지 선택</h3>

                <div id="addressList" style="margin-bottom: 15px;">
                    ${addressOptions}
                </div>

                <!-- 새 배송지 추가 버튼 (항상 표시) -->
                <button onclick="showAddAddressForm()" class="btn btn-secondary btn-block" style="margin-bottom: 15px;">
                    + 새 배송지 추가
                </button>

                <!-- 배송지 추가/수정 폼 (처음에는 숨김) -->
                <div id="addressForm" style="display: none; background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 15px;">
                    <h4 id="addressFormTitle" style="font-size: 16px; font-weight: 600; margin-bottom: 15px; color: #111827;">새 배송지 추가</h4>

                    <div style="margin-bottom: 12px;">
                        <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500; color: #374151;">받는 분</label>
                        <input type="text" id="addr_recipient_name" class="form-input" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;" required>
                    </div>

                    <div style="margin-bottom: 12px;">
                        <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500; color: #374151;">전화번호</label>
                        <input type="tel" id="addr_phone_number" class="form-input" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;" placeholder="010-1234-5678" required>
                    </div>

                    <div style="margin-bottom: 12px;">
                        <label style="display: block; margin-bottom: 5px; font-size: 13px; font-weight: 500; color: #374151;">주소</label>
                        <input type="text" id="addr_full_address" class="form-input" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px;" required>
                    </div>

                    <div style="margin-bottom: 15px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="addr_is_default" style="width: 18px; height: 18px;">
                            <span style="font-size: 14px; color: #374151;">기본 배송지로 설정</span>
                        </label>
                    </div>

                    <input type="hidden" id="addr_edit_id" value="">

                    <div style="display: flex; gap: 8px;">
                        <button onclick="cancelAddressForm()" class="btn btn-secondary" style="flex: 1;">취소</button>
                        <button onclick="saveAddress()" class="btn btn-primary" style="flex: 1;">저장</button>
                    </div>
                </div>

                <!-- 배송 메모 입력 -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; color: #374151;">
                        배송 메모 (선택)
                    </label>
                    <textarea id="shippingMemoInput" placeholder="예: 문 앞에 놔주세요, 배송 전 연락주세요 등"
                        style="width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; resize: vertical; min-height: 80px; font-family: inherit;"
                        oninput="shippingMemo = this.value;"></textarea>
                </div>

                <div style="padding: 15px; background-color: #f9fafb; border-radius: 8px; margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span style="color: #6b7280;">총 상품 수</span>
                        <span style="font-weight: 600;">${cartItems.length}개</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #e5e7eb;">
                        <span style="font-size: 16px; font-weight: 600;">결제 금액</span>
                        <span style="font-size: 20px; font-weight: 700; color: #2563eb;">${totalAmount.toLocaleString()}원</span>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="closeCheckoutModal()" class="btn btn-secondary" style="flex: 1;">취소</button>
                    <button onclick="showPaymentMethodModal()" class="btn btn-primary" style="flex: 1;" ${shippingAddresses.length === 0 ? 'disabled' : ''}>
                        다음
                    </button>
                </div>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
}

function updateAddressSelection() {
    // 선택된 주소의 border 색상 업데이트
    const labels = document.querySelectorAll('#checkoutModal label');
    labels.forEach(label => {
        const radio = label.querySelector('input[type="radio"]');
        if (radio && radio.checked) {
            label.style.borderColor = '#2563eb';
        } else {
            label.style.borderColor = '#e5e7eb';
        }
    });
}

function closeCheckoutModal() {
    const modal = document.getElementById('checkoutModal');
    if (modal) {
        modal.remove();
    }
}

function showPaymentMethodModal() {
    if (!selectedAddressId && shippingAddresses.length > 0) {
        showAlert('배송지를 선택해주세요.', 'error');
        return;
    }

    const totalAmount = cartItems.reduce((sum, item) => sum + item.final_price, 0);
    const selectedAddress = shippingAddresses.find(addr => addr.id === selectedAddressId);

    const modalHtml = `
        <div id="paymentModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0,0,0,0.5); z-index: 1001; overflow-y: auto;">
            <div style="background: white; margin: 50px 20px; border-radius: 8px; padding: 20px; max-width: 500px; margin-left: auto; margin-right: auto;">
                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 15px;">주문 / 결제</h3>

                <!-- 배송지 요약 -->
                <div style="padding: 15px; background-color: #f9fafb; border-radius: 8px; margin-bottom: 20px;">
                    <div style="font-size: 13px; color: #6b7280; margin-bottom: 5px;">배송지</div>
                    <div style="font-weight: 600; margin-bottom: 3px;">${selectedAddress.recipient_name}</div>
                    <div style="font-size: 13px; color: #6b7280;">${selectedAddress.full_address}</div>
                </div>

                <!-- 주문 상품 목록 -->
                <div style="margin-bottom: 20px;">
                    <h4 style="font-size: 15px; font-weight: 600; margin-bottom: 10px;">주문 상품</h4>
                    <div id="orderItemsList">
                        ${cartItems.map(item => `
                            <div style="padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; margin-bottom: 10px;">
                                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px;">
                                    <div style="flex: 1;">
                                        <div style="font-size: 14px; font-weight: 600; margin-bottom: 3px;">${item.product_name}</div>
                                        <div style="font-size: 12px; color: #6b7280;">제조년도: ${item.selected_year}년</div>
                                    </div>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div style="font-size: 14px; color: #2563eb; font-weight: 600;">
                                        ${item.discounted_price.toLocaleString()}원 × ${item.quantity}개
                                    </div>
                                    <div style="display: flex; gap: 5px; align-items: center;">
                                        <button onclick="updateQuantityInModal(${item.id}, ${item.quantity - 1}, ${item.available_stock})" class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;">-</button>
                                        <span style="padding: 0 8px; font-weight: 600; min-width: 30px; text-align: center;">${item.quantity}</span>
                                        <button onclick="updateQuantityInModal(${item.id}, ${item.quantity + 1}, ${item.available_stock})" class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;">+</button>
                                    </div>
                                </div>
                                <div style="text-align: right; margin-top: 5px; font-size: 13px; font-weight: 600;">
                                    = ${item.final_price.toLocaleString()}원
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <!-- 결제 수단 선택 -->
                <div style="margin-bottom: 20px;">
                    <h4 style="font-size: 15px; font-weight: 600; margin-bottom: 10px;">결제 수단</h4>

                    ${paymentMethods.length > 0 ? paymentMethods.map((method, index) => `
                        <label style="display: block; padding: 15px; border: 2px solid ${selectedPaymentMethodId === method.id ? '#2563eb' : '#e5e7eb'}; border-radius: 8px; margin-bottom: 10px; cursor: pointer; position: relative;" id="paymentMethod${method.id}">
                            <input type="radio" name="payment_method" value="saved_${method.id}" ${selectedPaymentMethodId === method.id ? 'checked' : ''} onchange="selectedPaymentMethodId = ${method.id}; updatePaymentMethodSelection();" style="margin-right: 10px;">
                            <div style="display: inline-block; vertical-align: top; width: calc(100% - 90px);">
                                <div style="font-weight: 600; margin-bottom: 3px;">
                                    ${method.payment_type === 'CARD' ? '💳' : '🏦'} ${method.masked_info}
                                    ${method.is_default ? '<span style="background: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px;">기본</span>' : ''}
                                </div>
                                ${method.nickname ? `<div style="font-size: 13px; color: #6b7280;">${method.nickname}</div>` : ''}
                            </div>
                            <button onclick="event.stopPropagation(); setDefaultPaymentMethod(${method.id});" style="position: absolute; top: 15px; right: 15px; background: #f3f4f6; border: 1px solid #d1d5db; color: #374151; padding: 5px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; ${method.is_default ? 'display: none;' : ''}">
                                기본
                            </button>
                        </label>
                    `).join('') : ''}

                    <!-- 새 결제 수단으로 결제 -->
                    <label style="display: block; padding: 15px; border: 2px solid ${!selectedPaymentMethodId ? '#2563eb' : '#e5e7eb'}; border-radius: 8px; margin-bottom: 10px; cursor: pointer;" id="paymentNew">
                        <input type="radio" name="payment_method" value="new_card" ${!selectedPaymentMethodId ? 'checked' : ''} onchange="selectedPaymentMethodId = null; updatePaymentMethodSelection();" style="margin-right: 10px;">
                        <div style="display: inline-block; vertical-align: top;">
                            <div style="font-weight: 600; margin-bottom: 3px;">💳 새 카드로 결제</div>
                            <div style="font-size: 13px; color: #6b7280;">토스페이먼츠로 안전하게 결제</div>
                        </div>
                    </label>

                    ${paymentMethods.length === 0 ? `
                        <div style="padding: 15px; background-color: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; margin-bottom: 10px;">
                            <div style="font-size: 13px; color: #92400e; line-height: 1.6;">
                                💡 <strong>결제 수단을 등록하면 더 빠르게 주문할 수 있습니다!</strong><br>
                                프로필 페이지에서 카드/계좌를 미리 등록하세요.
                            </div>
                        </div>
                    ` : ''}
                </div>

                <!-- 결제 금액 -->
                <div style="padding: 15px; background-color: #f9fafb; border-radius: 8px; margin-bottom: 20px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                        <span style="color: #6b7280;">총 상품 수</span>
                        <span style="font-weight: 600;">${cartItems.length}개</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #e5e7eb;">
                        <span style="font-size: 16px; font-weight: 600;">결제 금액</span>
                        <span style="font-size: 20px; font-weight: 700; color: #2563eb;">${totalAmount.toLocaleString()}원</span>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="closePaymentModal()" class="btn btn-secondary" style="flex: 1;">이전</button>
                    <button onclick="processPayment()" class="btn btn-primary" style="flex: 1;">결제하기</button>
                </div>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    updatePaymentMethodSelection();
}

function updatePaymentMethodSelection() {
    const radios = document.querySelectorAll('input[name="payment_method"]');

    radios.forEach(radio => {
        const label = radio.closest('label');
        if (radio.checked) {
            label.style.borderColor = '#2563eb';
            label.style.backgroundColor = '#eff6ff';
        } else {
            label.style.borderColor = '#e5e7eb';
            label.style.backgroundColor = 'white';
        }
    });
}

async function setDefaultPaymentMethod(methodId) {
    if (!confirm('이 결제 수단을 기본으로 설정하시겠습니까?')) {
        return;
    }

    showLoading();

    try {
        // 모든 결제 수단의 is_default를 false로 설정하고, 선택한 것만 true로
        // 실제로는 서버에서 처리해야 하지만, 현재는 프론트엔드에서만 업데이트
        paymentMethods.forEach(m => {
            m.is_default = (m.id === methodId);
        });

        // 선택된 결제 수단을 기본으로 설정
        selectedPaymentMethodId = methodId;

        hideLoading();
        showAlert('기본 결제 수단으로 설정되었습니다.', 'success');

        // 모달 닫고 다시 열기 (UI 업데이트)
        closePaymentModal();
        setTimeout(() => {
            showPaymentMethodModal();
        }, 300);

    } catch (error) {
        hideLoading();
        console.error('기본 결제 수단 설정 오류:', error);
        showAlert('설정 중 오류가 발생했습니다.', 'error');
    }
}

function closePaymentModal() {
    const modal = document.getElementById('paymentModal');
    if (modal) {
        modal.remove();
    }
}

async function processPayment() {
    const paymentMethodValue = document.querySelector('input[name="payment_method"]:checked').value;

    if (paymentMethodValue.startsWith('saved_')) {
        // 등록된 결제 수단으로 결제
        const methodId = parseInt(paymentMethodValue.replace('saved_', ''));
        await processSavedPaymentMethod(methodId);
    } else if (paymentMethodValue === 'new_card') {
        // 새 카드로 결제 (토스페이먼츠 결제창)
        await processCardPayment();
    }
}

async function processSavedPaymentMethod(methodId) {
    const selectedMethod = paymentMethods.find(m => m.id === methodId);
    if (!selectedMethod) {
        showAlert('결제 수단을 찾을 수 없습니다.', 'error');
        return;
    }

    if (!confirm(`${selectedMethod.masked_info}로 결제하시겠습니까?`)) {
        return;
    }

    const customerCode = getCustomerCode();
    const selectedAddress = shippingAddresses.find(addr => addr.id === selectedAddressId);
    const totalAmount = cartItems.reduce((sum, item) => sum + item.final_price, 0);

    showLoading();

    try {
        const cartIds = cartItems.map(item => item.id);

        // TODO: 빌링키를 사용한 자동 결제 API 호출
        // 현재는 주문만 생성하고, 실제 빌링키 결제는 추후 구현
        const response = await fetch('/api/mobile/orders/create/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                customer_code: customerCode,
                cart_ids: cartIds,
                shipping_address: selectedAddress ? selectedAddress.full_address : '',
                shipping_memo: shippingMemo || '',
                payment_method_id: methodId,
                payment_method: selectedMethod.payment_type === 'CARD' ? 'card' : 'account',
                amount: totalAmount,
                use_saved_method: true
            })
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            showAlert('주문이 완료되었습니다!', 'success');

            closePaymentModal();
            closeCheckoutModal();

            // 주문 완료 페이지로 이동
            setTimeout(() => {
                location.href = `/mobile/orders/${data.data.order_id}/`;
            }, 1500);
        } else {
            showAlert(data.message || '주문 실패', 'error');
        }
    } catch (error) {
        hideLoading();
        console.error('주문 오류:', error);
        showAlert('주문 처리 중 오류가 발생했습니다.', 'error');
    }
}

async function processCardPayment() {
    const customerCode = getCustomerCode();
    const selectedAddress = shippingAddresses.find(addr => addr.id === selectedAddressId);
    const totalAmount = cartItems.reduce((sum, item) => sum + item.final_price, 0);

    showLoading();

    try {
        const cartIds = cartItems.map(item => item.id);

        // 1. 주문 생성 (결제 준비)
        const response = await fetch('/api/mobile/payment/prepare/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                customer_code: customerCode,
                cart_ids: cartIds,
                shipping_address: selectedAddress ? selectedAddress.full_address : '',
                shipping_memo: shippingMemo || '',
                payment_method: 'card',
                amount: totalAmount
            })
        });

        const data = await response.json();
        hideLoading();

        if (!data.success) {
            showAlert(data.message || '결제 준비 실패', 'error');
            return;
        }

        closePaymentModal();
        closeCheckoutModal();

        // 2. 토스페이먼츠 결제창 호출 (실제 운영 키)
        const clientKey = data.data.client_key || 'live_ck_jExPeJWYVQ1zDYG7N7PEV49R5gvN';
        console.log('Client Key:', clientKey);

        // TossPayments SDK 로드 확인
        if (typeof TossPayments === 'undefined') {
            throw new Error('TossPayments SDK가 로드되지 않았습니다');
        }

        const tossPayments = TossPayments(clientKey);
        console.log('TossPayments 인스턴스 생성 완료');

        // 결제 요청
        await tossPayments.requestPayment('카드', {
            amount: totalAmount,
            orderId: data.data.order_number,
            orderName: `타이어 ${cartItems.length}개`,
            customerName: data.data.customer_name,
            successUrl: window.location.origin + '/mobile/payment/success/',
            failUrl: window.location.origin + '/mobile/cart/?payment=failed',
        });

    } catch (error) {
        hideLoading();
        console.error('카드결제 오류:', error);
        showAlert('결제 처리 중 오류: ' + (error.message || error.toString()), 'error');
    }
}

async function processTransferPayment() {
    const customerCode = getCustomerCode();
    const selectedAddress = shippingAddresses.find(addr => addr.id === selectedAddressId);

    showLoading();

    try {
        const cartIds = cartItems.map(item => item.id);
        const totalAmount = cartItems.reduce((sum, item) => sum + item.final_price, 0);

        // 1. 결제 준비 API 호출
        const response = await fetch('/api/mobile/payment/prepare/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                customer_code: customerCode,
                cart_ids: cartIds,
                shipping_address: selectedAddress ? selectedAddress.full_address : '',
                shipping_memo: shippingMemo || '',
                payment_method: 'transfer',
                amount: totalAmount
            })
        });

        const data = await response.json();
        hideLoading();

        if (!data.success) {
            showAlert(data.message || '결제 준비 실패', 'error');
            return;
        }

        closePaymentModal();
        closeCheckoutModal();

        // 2. 토스페이먼츠 결제창 호출 (계좌이체 실제 운영)
        const clientKey = data.data.client_key || 'live_ck_jExPeJWYVQ1zDYG7N7PEV49R5gvN';
        const tossPayments = TossPayments(clientKey);

        // 계좌이체 결제 요청
        await tossPayments.requestPayment('계좌이체', {
            amount: totalAmount,
            orderId: data.data.order_number,
            orderName: `타이어 ${cartItems.length}개`,
            customerName: data.data.customer_name,
            successUrl: window.location.origin + '/mobile/payment/success/',
            failUrl: window.location.origin + '/mobile/cart/?payment=failed',
        });

    } catch (error) {
        hideLoading();
        console.error('주문 오류:', error);
        showAlert('주문 처리 중 오류: ' + (error.message || error.toString()), 'error');
    }
}

// ========================================
// 결제 수단 로딩 함수
// ========================================

async function loadPaymentMethods() {
    const customerCode = getCustomerCode();
    if (!customerCode) return;

    try {
        const response = await fetch(`/api/mobile/payment-methods/?customer_code=${customerCode}`);
        const data = await response.json();

        if (data.success) {
            paymentMethods = data.data;

            // 기본 결제 수단 자동 선택
            const defaultMethod = paymentMethods.find(m => m.is_default);
            if (defaultMethod) {
                selectedPaymentMethodId = defaultMethod.id;
            } else if (paymentMethods.length > 0) {
                selectedPaymentMethodId = paymentMethods[0].id;
            }
        }
    } catch (error) {
        console.error('결제 수단 로드 오류:', error);
    }
}

// ========================================
// 배송지 추가/수정 관련 함수
// ========================================

function showAddAddressForm() {
    document.getElementById('addressFormTitle').textContent = '새 배송지 추가';
    document.getElementById('addr_recipient_name').value = '';
    document.getElementById('addr_phone_number').value = '';
    document.getElementById('addr_full_address').value = '';
    document.getElementById('addr_is_default').checked = false;
    document.getElementById('addr_edit_id').value = '';
    document.getElementById('addressForm').style.display = 'block';

    // 폼 위치로 스크롤
    setTimeout(() => {
        document.getElementById('addressForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
}

function editAddress(addressId) {
    const address = shippingAddresses.find(addr => addr.id === addressId);
    if (!address) {
        showAlert('배송지를 찾을 수 없습니다.', 'error');
        return;
    }

    document.getElementById('addressFormTitle').textContent = '배송지 수정';
    document.getElementById('addr_recipient_name').value = address.recipient_name;
    document.getElementById('addr_phone_number').value = address.phone_number;
    document.getElementById('addr_full_address').value = address.full_address;
    document.getElementById('addr_is_default').checked = address.is_default;
    document.getElementById('addr_edit_id').value = addressId;
    document.getElementById('addressForm').style.display = 'block';

    // 폼 위치로 스크롤
    setTimeout(() => {
        document.getElementById('addressForm').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 100);
}

function cancelAddressForm() {
    document.getElementById('addressForm').style.display = 'none';
    document.getElementById('addr_recipient_name').value = '';
    document.getElementById('addr_phone_number').value = '';
    document.getElementById('addr_full_address').value = '';
    document.getElementById('addr_is_default').checked = false;
    document.getElementById('addr_edit_id').value = '';
}

async function saveAddress() {
    const recipientName = document.getElementById('addr_recipient_name').value.trim();
    const phoneNumber = document.getElementById('addr_phone_number').value.trim();
    const fullAddress = document.getElementById('addr_full_address').value.trim();
    const isDefault = document.getElementById('addr_is_default').checked;
    const editId = document.getElementById('addr_edit_id').value;

    if (!recipientName || !phoneNumber || !fullAddress) {
        showAlert('모든 필수 정보를 입력해주세요.', 'error');
        return;
    }

    showLoading();

    try {
        const customerCode = getCustomerCode();
        const url = editId
            ? `/api/mobile/shipping-addresses/${editId}/update/`
            : '/api/mobile/shipping-addresses/add/';

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                customer_code: customerCode,
                recipient_name: recipientName,
                phone_number: phoneNumber,
                full_address: fullAddress,
                is_default: isDefault
            })
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            showAlert(editId ? '배송지가 수정되었습니다.' : '배송지가 추가되었습니다.', 'success');
            cancelAddressForm();

            // 배송지 목록 다시 로드
            await loadShippingAddresses();

            // 모달 닫고 다시 열기
            closeCheckoutModal();
            setTimeout(() => {
                showAddressSelectModal();
            }, 300);
        } else {
            showAlert(data.message || '배송지 저장에 실패했습니다.', 'error');
        }
    } catch (error) {
        hideLoading();
        console.error('배송지 저장 오류:', error);
        showAlert('배송지 저장 중 오류가 발생했습니다.', 'error');
    }
}

loadCart();
loadPaymentMethods();
</script>
