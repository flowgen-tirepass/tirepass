{% extends "mobile/base.html" %}

{% block title %}주문내역 - 타이어패스{% endblock %}
{% block header_title %}주문내역{% endblock %}
{% block nav_orders %}active{% endblock %}

{% block content %}
<div id="ordersList"></div>
{% endblock %}

{% block extra_js %}
<script>
// 페이지 로드 즉시 로그인 체크 (보안 강화)
if (!getCustomerCode()) {
    location.href = '/mobile/login/';
}

async function loadOrders() {
    const customerCode = getCustomerCode();
    if (!customerCode) {
        location.href = '/mobile/login/';
        return;
    }

    showLoading();

    try {
        const response = await fetch(`/api/mobile/orders/?customer_code=${customerCode}`);
        const data = await response.json();
        hideLoading();

        if (data.success) {
            renderOrders(data.data.orders);
        }
    } catch (error) {
        hideLoading();
        showAlert('오류가 발생했습니다', 'error');
    }
}

function renderOrders(orders) {
    const container = document.getElementById('ordersList');

    if (orders.length === 0) {
        container.innerHTML = '<div class="card"><p style="text-align: center; color: #6b7280;">주문 내역이 없습니다</p></div>';
        return;
    }

    const statusText = {
        'pending': '주문대기',
        'confirmed': '주문확인',
        'preparing': '출고준비',
        'shipped': '배송중',
        'delivered': '배송완료',
        'cancelled': '주문취소'
    };

    const paymentText = {
        'unpaid': '미결제',
        'paid': '결제완료',
        'refunded': '환불완료'
    };

    container.innerHTML = orders.map(order => `
        <div class="card">
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <span style="font-weight: 600;">${order.order_number}</span>
                <span class="badge badge-blue">${statusText[order.order_status] || order.order_status}</span>
            </div>

            <p style="font-size: 13px; color: #6b7280; margin-bottom: 10px;">${order.order_date}</p>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div>
                    <div style="font-size: 18px; font-weight: 600; color: #2563eb;">
                        ${order.final_amount.toLocaleString()}원
                    </div>
                    <div style="font-size: 13px; color: #6b7280;">
                        ${order.items_count}개 상품 • ${paymentText[order.payment_status]}
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 8px;">
                <button onclick="event.stopPropagation(); reorder(${order.id});" class="btn btn-primary" style="flex: 1; padding: 8px 16px; font-size: 13px;">
                    재주문
                </button>
                <button onclick="location.href='/mobile/orders/${order.id}/';" class="btn btn-secondary" style="flex: 1; padding: 8px 16px; font-size: 13px;">
                    상세보기
                </button>
            </div>
        </div>
    `).join('');
}

async function reorder(orderId) {
    if (!confirm('이 주문의 상품을 장바구니에 담으시겠습니까?')) return;

    const customerCode = getCustomerCode();
    if (!customerCode) {
        location.href = '/mobile/login/';
        return;
    }

    showLoading();

    try {
        const response = await fetch(`/api/mobile/orders/${orderId}/reorder/`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                customer_code: customerCode
            })
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            showAlert(data.message, 'success');

            // 장바구니로 이동할지 물어보기
            if (confirm('장바구니로 이동하시겠습니까?')) {
                location.href = '/mobile/cart/';
            }
        } else {
            showAlert(data.message || '재주문 실패', 'error');
        }
    } catch (error) {
        hideLoading();
        console.error('재주문 오류:', error);
        showAlert('재주문 중 오류가 발생했습니다', 'error');
    }
}

loadOrders();
</script>
{% endblock %}
