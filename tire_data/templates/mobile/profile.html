{% extends "mobile/base.html" %}

{% block title %}내정보 - TirePASS{% endblock %}
{% block header_title %}내정보{% endblock %}
{% block nav_profile %}active{% endblock %}

{% block content %}
<div id="profileInfo"></div>

<!-- 비밀번호 변경 섹션 -->
<div class="card" id="changePasswordSection" style="display: none;">
    <h3 style="margin-bottom: 20px; font-size: 18px; font-weight: 600; color: #dc2626;">🔒 비밀번호 변경</h3>
    <form id="changePasswordForm" autocomplete="off">
        <div class="form-group">
            <label class="form-label">현재 비밀번호</label>
            <input type="password" class="form-input" id="current_password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required>
        </div>
        <div class="form-group">
            <label class="form-label">새 비밀번호 (4자 이상)</label>
            <input type="password" class="form-input" id="new_password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required minlength="4">
        </div>
        <div class="form-group">
            <label class="form-label">새 비밀번호 확인</label>
            <input type="password" class="form-input" id="confirm_password" autocomplete="new-password" readonly onfocus="this.removeAttribute('readonly');" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary btn-block">비밀번호 변경</button>
        <button type="button" onclick="hideChangePassword()" class="btn btn-secondary btn-block" style="margin-top: 10px;">취소</button>
    </form>
</div>

<!-- 결제 수단 관리 -->
<div class="card">
    <h3 style="margin-bottom: 15px; font-size: 18px; font-weight: 600; color: #111827;">💳 결제 수단 관리</h3>
    <div id="paymentMethodsList"></div>
    <button onclick="showAddPaymentMethod()" class="btn btn-primary btn-block" style="margin-top: 15px;">
        + 카드/계좌 등록
    </button>
</div>

<div class="card">
    <a href="/mobile/home/" class="btn btn-primary btn-block">홈으로 가기</a>
    <a href="/mobile/addresses/" class="btn btn-secondary btn-block" style="margin-top: 10px;">배송지 관리</a>
    <button onclick="showChangePassword()" class="btn btn-secondary btn-block" style="margin-top: 10px;">비밀번호 변경</button>
    <button onclick="logout()" class="btn btn-danger btn-block" style="margin-top: 10px;">로그아웃</button>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadProfile() {
    const customerCode = getCustomerCode();
    if (!customerCode) {
        location.href = '/mobile/login/';
        return;
    }

    showLoading();

    try {
        const response = await fetch(`/api/mobile/auth/profile/?customer_code=${customerCode}`);
        const data = await response.json();
        hideLoading();

        if (data.success) {
            renderProfile(data.data);
        }
    } catch (error) {
        hideLoading();
        showAlert('오류가 발생했습니다', 'error');
    }
}

function renderProfile(profile) {
    const container = document.getElementById('profileInfo');

    container.innerHTML = `
        <div class="card">
            <h2 style="margin-bottom: 20px; font-size: 20px; font-weight: 600;">${profile.name}</h2>

            <table style="width: 100%; font-size: 14px;">
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 12px 0; color: #6b7280; width: 100px;">고객코드</td>
                    <td style="padding: 12px 0; font-weight: 500;">${profile.customer_code}</td>
                </tr>
                ${profile.rep ? `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 12px 0; color: #6b7280;">대표자</td>
                    <td style="padding: 12px 0; font-weight: 500;">${profile.rep}</td>
                </tr>
                ` : ''}
                ${profile.tel1 ? `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 12px 0; color: #6b7280;">전화번호</td>
                    <td style="padding: 12px 0; font-weight: 500;">${profile.tel1}</td>
                </tr>
                ` : ''}
                ${profile.tel3 ? `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="padding: 12px 0; color: #6b7280;">휴대전화</td>
                    <td style="padding: 12px 0; font-weight: 500;">${profile.tel3}</td>
                </tr>
                ` : ''}
                ${profile.enno ? `
                <tr>
                    <td style="padding: 12px 0; color: #6b7280;">사업자번호</td>
                    <td style="padding: 12px 0; font-weight: 500;">${profile.enno}</td>
                </tr>
                ` : ''}
            </table>
        </div>
    `;
}

async function logout() {
    if (!confirm('로그아웃 하시겠습니까?')) return;

    try {
        await fetch('/api/mobile/auth/logout/', {method: 'POST'});
        clearCustomerCode();
        localStorage.clear();
        showAlert('로그아웃 되었습니다', 'success');
        setTimeout(() => {
            location.href = '/mobile/login/';
        }, 1000);
    } catch (error) {
        showAlert('오류가 발생했습니다', 'error');
    }
}

function showChangePassword() {
    document.getElementById('changePasswordSection').style.display = 'block';
    window.scrollTo({ top: document.getElementById('changePasswordSection').offsetTop - 20, behavior: 'smooth' });
}

function hideChangePassword() {
    document.getElementById('changePasswordSection').style.display = 'none';
    document.getElementById('changePasswordForm').reset();
}

document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const currentPassword = document.getElementById('current_password').value;
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (newPassword !== confirmPassword) {
        showAlert('새 비밀번호가 일치하지 않습니다', 'error');
        return;
    }

    if (newPassword.length < 4) {
        showAlert('비밀번호는 최소 4자 이상이어야 합니다', 'error');
        return;
    }

    showLoading();

    try {
        const response = await fetch('/api/mobile/auth/change-password/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                customer_code: getCustomerCode(),
                current_password: currentPassword,
                new_password: newPassword,
                confirm_password: confirmPassword
            })
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            showAlert('비밀번호가 변경되었습니다. 홈으로 이동합니다.', 'success');
            setTimeout(() => {
                location.href = '/mobile/home/';
            }, 1500);
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('비밀번호 변경 중 오류가 발생했습니다', 'error');
    }
});

// URL 파라미터 확인하여 비밀번호 변경 폼 자동 표시
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('change_password') === 'true') {
    setTimeout(() => {
        showChangePassword();
        showAlert('보안을 위해 비밀번호를 변경해주세요', 'info');
    }, 500);
}

// 결제 수단 조회
async function loadPaymentMethods() {
    const customerCode = getCustomerCode();
    if (!customerCode) return;

    try {
        const response = await fetch(`/api/mobile/payment-methods/?customer_code=${customerCode}`);
        const data = await response.json();

        if (data.success) {
            renderPaymentMethods(data.data);
        }
    } catch (error) {
        console.error('결제 수단 조회 오류:', error);
    }
}

function renderPaymentMethods(methods) {
    const container = document.getElementById('paymentMethodsList');

    if (!methods || methods.length === 0) {
        container.innerHTML = `
            <div style="text-align: center; padding: 30px; color: #9ca3af;">
                <div style="font-size: 48px; margin-bottom: 10px;">💳</div>
                <p>등록된 결제 수단이 없습니다</p>
                <p style="font-size: 13px; margin-top: 5px;">카드나 계좌를 등록하면 빠르게 주문할 수 있습니다</p>
            </div>
        `;
        return;
    }

    const html = methods.map(method => `
        <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 15px; margin-bottom: 10px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="flex: 1;">
                    <div style="font-weight: 600; color: #111827; margin-bottom: 5px;">
                        ${method.payment_type === 'CARD' ? '💳' : '🏦'} ${method.masked_info}
                        ${method.is_default ? '<span style="background: #3b82f6; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px;">기본</span>' : ''}
                    </div>
                    ${method.nickname ? `<div style="font-size: 13px; color: #6b7280;">${method.nickname}</div>` : ''}
                </div>
                <div>
                    <button onclick="deletePaymentMethod(${method.id})" class="btn btn-sm" style="background: #ef4444; color: white; padding: 5px 10px; font-size: 12px;">
                        삭제
                    </button>
                </div>
            </div>
        </div>
    `).join('');

    container.innerHTML = html;
}

function showAddPaymentMethod() {
    showAlert('결제 수단 등록 기능은 준비 중입니다', 'info');
}

async function deletePaymentMethod(methodId) {
    if (!confirm('이 결제 수단을 삭제하시겠습니까?')) return;

    showLoading();

    try {
        const response = await fetch(`/api/mobile/payment-methods/${methodId}/`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                customer_code: getCustomerCode()
            })
        });

        const data = await response.json();
        hideLoading();

        if (data.success) {
            showAlert('결제 수단이 삭제되었습니다', 'success');
            loadPaymentMethods();
        } else {
            showAlert(data.message, 'error');
        }
    } catch (error) {
        hideLoading();
        showAlert('삭제 중 오류가 발생했습니다', 'error');
    }
}

loadProfile();
loadPaymentMethods();
</script>
{% endblock %}
