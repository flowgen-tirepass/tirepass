<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - TirePASS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .login-header {
            padding: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:active {
            background: rgba(255,255,255,0.3);
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .login-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease-out;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .logo-icon {
            font-size: 40px;
        }

        .login-title {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #666;
        }

        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #856404;
            line-height: 1.6;
        }

        .warning-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .warning-icon {
            color: #ff9800;
            font-size: 18px;
            margin-right: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f8f8;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .form-input::placeholder {
            color: #999;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider-text {
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 13px;
            position: relative;
        }

        .biometric-btn {
            width: 100%;
            padding: 14px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .biometric-btn:active {
            background: #f8f8f8;
            border-color: #667eea;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .alert-success {
            background: #efe;
            border: 1px solid #cfc;
            color: #3c3;
        }

        @media (max-width: 374px) {
            .login-card {
                padding: 25px 20px;
            }

            .login-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-header">
        <a href="/mobile/" class="back-btn">←</a>
        <h1 class="header-title">로그인</h1>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-circle">
                    <span class="logo-icon">👤</span>
                </div>
                <h2 class="login-title">TirePASS B2B 로그인</h2>
                <p class="login-subtitle">사업자등록번호로 로그인하세요</p>
            </div>

            <div class="warning-box">
                <strong><span class="warning-icon">⚠</span> 기존 고객님께 안내드립니다</strong>
                • 아이디: 사업자등록번호 10자리 (하이픈 제외)<br>
                • 초기 비밀번호: 사업자등록번호 뒤 5자리<br>
                • 보안을 위해 로그인 후 반드시 비밀번호를 변경해주세요!
            </div>

            <div id="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="customer_code" class="form-label">사업자등록번호</label>
                    <input type="text"
                           id="customer_code"
                           name="customer_code"
                           class="form-input"
                           placeholder="'-' 없이 10자리 숫자 입력"
                           maxlength="10"
                           pattern="[0-9]{10}"
                           required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-input"
                           placeholder="비밀번호 입력"
                           required>
                </div>

                <button type="submit" class="login-btn">로그인</button>
            </form>

            <div class="divider">
                <span class="divider-text">또는</span>
            </div>

            <button type="button" class="biometric-btn" onclick="location.href='/mobile/home/'">
                <span>👁</span>
                <span>둘러보기 (비회원)</span>
            </button>
        </div>
    </div>

    <script>
        // 사업자번호 자동 포맷팅
        const customerInput = document.getElementById('customer_code');

        customerInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9]/g, '');
            if (value.length > 10) {
                value = value.substr(0, 10);
            }
            e.target.value = value;
        });

        async function handleLogin(e) {
            e.preventDefault();

            const customerCode = document.getElementById('customer_code').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/mobile/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        customer_code: customerCode,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.success) {
                    // 로그인 성공
                    localStorage.setItem('customer_code', customerCode);
                    localStorage.setItem('customer_name', data.data.name);
                    location.href = '/mobile/home/';
                } else {
                    // 로그인 실패
                    showAlert(data.message || '로그인에 실패했습니다', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('로그인 중 오류가 발생했습니다', 'error');
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            setTimeout(() => {
                alertDiv.className = '';
                alertDiv.textContent = '';
            }, 3000);
        }
    </script>
</body>
</html>
