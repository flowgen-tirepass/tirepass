{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<style>
    /* ERP 상태 위젯 스타일 */
    #erp-status-widget {
        position: fixed;
        top: 10px;
        right: 20px;
        z-index: 9999;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        padding: 12px 16px;
        min-width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #erp-status-widget .widget-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #e5e7eb;
    }

    #erp-status-widget .widget-title {
        font-size: 14px;
        font-weight: 600;
        color: #374151;
    }

    #erp-status-widget .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
    }

    #erp-status-widget .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        animation: pulse 2s infinite;
    }

    #erp-status-widget .status-dot.connected {
        background-color: #10b981;
    }

    #erp-status-widget .status-dot.disconnected {
        background-color: #ef4444;
        animation: blink 1s infinite;
    }

    #erp-status-widget .status-dot.checking {
        background-color: #f59e0b;
    }

    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }

    @keyframes blink {
        0%, 50%, 100% { opacity: 1; }
        25%, 75% { opacity: 0.3; }
    }

    #erp-status-widget .status-info {
        font-size: 12px;
        color: #6b7280;
        margin: 4px 0;
        line-height: 1.4;
    }

    #erp-status-widget .reconnect-btn {
        width: 100%;
        padding: 8px 12px;
        background-color: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        margin-top: 10px;
        transition: background-color 0.2s;
    }

    #erp-status-widget .reconnect-btn:hover {
        background-color: #1d4ed8;
    }

    #erp-status-widget .reconnect-btn:disabled {
        background-color: #9ca3af;
        cursor: not-allowed;
    }

    #erp-status-widget .error-message {
        background-color: #fef2f2;
        color: #991b1b;
        padding: 6px 8px;
        border-radius: 4px;
        font-size: 11px;
        margin-top: 6px;
    }
</style>
{% endblock %}

{% block content %}
<!-- ERP 연동 상태 위젯 -->
<div id="erp-status-widget">
    <div class="widget-header">
        <span class="widget-title">🔗 ERP 연동 상태</span>
    </div>
    <div class="status-indicator">
        <span class="status-dot checking" id="status-dot"></span>
        <span id="status-text">확인 중...</span>
    </div>
    <div class="status-info" id="status-info">
        연결 확인 중입니다.
    </div>
    <div id="error-container"></div>
    <button class="reconnect-btn" id="reconnect-btn" onclick="reconnectERP()">
        수동 재연결
    </button>
</div>

<script>
let statusCheckInterval;
let autoReconnectAttempts = 0;
const MAX_AUTO_RECONNECT_ATTEMPTS = 3;

// ERP 상태 확인
async function checkERPStatus() {
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const statusInfo = document.getElementById('status-info');
    const errorContainer = document.getElementById('error-container');

    try {
        const response = await fetch('/api/admin/erp/status/');
        const data = await response.json();

        if (data.success && data.status === 'connected') {
            // 연결 성공
            statusDot.className = 'status-dot connected';
            statusText.textContent = '연결됨';

            let infoHTML = `응답 시간: ${data.response_time}ms`;
            if (data.last_sync_time) {
                const syncDate = new Date(data.last_sync_time);
                infoHTML += `<br>마지막 동기화: ${syncDate.toLocaleString('ko-KR')}`;
            }
            if (data.goods_count) {
                infoHTML += `<br>상품 수: ${data.goods_count.toLocaleString()}개`;
            }

            statusInfo.innerHTML = infoHTML;
            errorContainer.innerHTML = '';
            autoReconnectAttempts = 0; // 성공 시 재시도 카운터 초기화

        } else {
            // 연결 실패
            statusDot.className = 'status-dot disconnected';
            statusText.textContent = '연결 끊김';
            statusInfo.innerHTML = `ERP 서버: ${data.erp_api_url}<br>재시도 횟수: ${data.retry_count}회`;

            if (data.error_message) {
                errorContainer.innerHTML = `<div class="error-message">오류: ${data.error_message}</div>`;
            }

            // 자동 재연결 시도
            if (autoReconnectAttempts < MAX_AUTO_RECONNECT_ATTEMPTS) {
                autoReconnectAttempts++;
                console.log(`자동 재연결 시도 ${autoReconnectAttempts}/${MAX_AUTO_RECONNECT_ATTEMPTS}`);
                setTimeout(() => autoReconnect(), 5000); // 5초 후 자동 재연결
            } else {
                errorContainer.innerHTML += '<div class="error-message">자동 재연결 실패. 수동 재연결을 시도해주세요.</div>';
            }
        }

    } catch (error) {
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = '오류';
        statusInfo.textContent = '상태 확인 실패';
        errorContainer.innerHTML = `<div class="error-message">오류: ${error.message}</div>`;
    }
}

// 자동 재연결
async function autoReconnect() {
    console.log('자동 재연결 시작...');
    await checkERPStatus();
}

// 수동 재연결
async function reconnectERP() {
    const btn = document.getElementById('reconnect-btn');
    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');
    const statusInfo = document.getElementById('status-info');
    const errorContainer = document.getElementById('error-container');

    btn.disabled = true;
    btn.textContent = '재연결 중...';
    statusDot.className = 'status-dot checking';
    statusText.textContent = '재연결 중...';
    statusInfo.textContent = 'ERP 서버에 연결을 시도하고 있습니다.';
    errorContainer.innerHTML = '';

    try {
        const response = await fetch('/api/admin/erp/reconnect/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        });

        const data = await response.json();

        if (data.success) {
            statusDot.className = 'status-dot connected';
            statusText.textContent = '연결됨';
            statusInfo.textContent = `재연결 성공 (${data.total_attempts}회 시도)`;
            errorContainer.innerHTML = '<div style="background-color: #dcfce7; color: #166534; padding: 6px 8px; border-radius: 4px; font-size: 11px; margin-top: 6px;">재연결에 성공했습니다!</div>';
            autoReconnectAttempts = 0; // 성공 시 카운터 초기화
        } else {
            statusDot.className = 'status-dot disconnected';
            statusText.textContent = '연결 실패';
            statusInfo.textContent = `재연결 실패 (${data.total_attempts}회 시도)`;

            let errorHTML = '<div class="error-message">재연결 실패:<br>';
            data.attempts.forEach(attempt => {
                errorHTML += `시도 ${attempt.attempt_number}: ${attempt.error}<br>`;
            });
            errorHTML += '</div>';
            errorContainer.innerHTML = errorHTML;
        }

    } catch (error) {
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = '오류';
        statusInfo.textContent = '재연결 실패';
        errorContainer.innerHTML = `<div class="error-message">오류: ${error.message}</div>`;
    } finally {
        btn.disabled = false;
        btn.textContent = '수동 재연결';
    }

    // 재연결 후 상태 다시 확인
    setTimeout(checkERPStatus, 2000);
}

// 페이지 로드 시 실행
document.addEventListener('DOMContentLoaded', function() {
    // 초기 상태 확인
    checkERPStatus();

    // 30초마다 상태 확인
    statusCheckInterval = setInterval(checkERPStatus, 30000);
});

// 페이지 언로드 시 인터벌 정리
window.addEventListener('beforeunload', function() {
    if (statusCheckInterval) {
        clearInterval(statusCheckInterval);
    }
});
</script>

{{ block.super }}
{% endblock %}
