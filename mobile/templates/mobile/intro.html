<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TirePASS - B2B 타이어 쇼핑몰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .intro-container {
            text-align: center;
            animation: fadeInUp 1s ease-out;
            padding: 20px;
            width: 100%;
            max-width: 400px;
        }

        .logo-container {
            margin-bottom: 40px;
            animation: pulse 2s infinite;
        }

        .logo {
            width: 120px;
            height: 120px;
            background: white;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .logo-icon {
            font-size: 60px;
        }

        .app-title {
            font-size: 32px;
            color: white;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .app-subtitle {
            font-size: 16px;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
        }

        .intro-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .intro-btn {
            padding: 18px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn-login {
            background: white;
            color: #667eea;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .btn-browse {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
        }

        .btn-browse:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .features {
            position: absolute;
            bottom: 30px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
            color: white;
            font-size: 14px;
            opacity: 0.9;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .feature-icon {
            font-size: 24px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .loading-dots {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .version {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }

        @media (max-width: 374px) {
            .app-title {
                font-size: 28px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .logo-icon {
                font-size: 50px;
            }
        }

        @media (min-width: 768px) {
            .intro-container {
                max-width: 500px;
            }

            .intro-buttons {
                flex-direction: row;
                justify-content: center;
            }

            .intro-btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="version">v1.0.0</div>

    <div class="intro-container">
        <div class="logo-container">
            <div class="logo">
                <span class="logo-icon">🛞</span>
            </div>
        </div>

        <h1 class="app-title">TirePASS</h1>
        <p class="app-subtitle">B2B 타이어 전문 쇼핑몰</p>

        <div class="intro-buttons">
            <a href="{% url 'mobile_login' %}" class="intro-btn btn-login">로그인</a>
            <a href="{% url 'mobile_index' %}" class="intro-btn btn-browse">둘러보기</a>
        </div>
    </div>

    <div class="features">
        <div class="feature-item">
            <span class="feature-icon">🚚</span>
            <span>빠른배송</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">💰</span>
            <span>최저가</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">✨</span>
            <span>정품보증</span>
        </div>
    </div>

    <div class="loading-dots">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <script>
        // PWA 설치 프롬프트
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        // 자동 리다이렉트 (옵션)
        // setTimeout(() => {
        //     window.location.href = "{% url 'mobile_index' %}";
        // }, 3000);
    </script>
</body>
</html>
