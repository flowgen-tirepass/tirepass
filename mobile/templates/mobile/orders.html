{% extends 'mobile/base.html' %}
{% load humanize %}

{% block title %}주문 내역 - TirePASS{% endblock %}
{% block header_title %}주문 내역{% endblock %}

{% block extra_styles %}
<style>
    .orders-container {
        padding-bottom: 80px;
    }

    .filter-tabs {
        display: flex;
        background: white;
        padding: 2vw 3vw;
        margin: -10px -10px 15px;
        border-bottom: 1px solid #e0e0e0;
        overflow-x: auto;
        gap: 2vw;
    }

    .filter-tab {
        flex-shrink: 0;
        padding: 2.5vw 4vw;
        border-radius: 2vw;
        font-size: 3.5vw;
        font-weight: 600;
        background: #f5f5f5;
        color: #666;
        cursor: pointer;
        border: none;
    }

    .filter-tab.active {
        background: #667eea;
        color: white;
    }

    .orders-empty {
        text-align: center;
        padding: 20vw 5vw;
        background: white;
        margin: 5vw;
        border-radius: 3vw;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .empty-icon {
        font-size: 20vw;
        opacity: 0.3;
        margin-bottom: 4vw;
    }

    .empty-text {
        font-size: 4vw;
        color: #999;
        margin-bottom: 6vw;
    }

    .btn-go-shop {
        display: inline-block;
        padding: 3.5vw 8vw;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 2.5vw;
        font-size: 4vw;
        font-weight: bold;
    }

    .order-card {
        background: white;
        margin: 3vw;
        border-radius: 3vw;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .order-header {
        background: #f8f9fa;
        padding: 3.5vw;
        border-bottom: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .order-date {
        font-size: 3.5vw;
        color: #666;
    }

    .order-status {
        display: inline-block;
        padding: 1.5vw 3vw;
        border-radius: 1.5vw;
        font-size: 3vw;
        font-weight: bold;
    }

    .status-pending {
        background: #fff3cd;
        color: #856404;
    }

    .status-confirmed {
        background: #d1ecf1;
        color: #0c5460;
    }

    .status-shipping {
        background: #d4edda;
        color: #155724;
    }

    .status-delivered {
        background: #e2e3e5;
        color: #383d41;
    }

    .status-cancelled {
        background: #f8d7da;
        color: #721c24;
    }

    .order-body {
        padding: 4vw;
    }

    .order-number-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 3vw;
        padding-bottom: 3vw;
        border-bottom: 1px solid #f0f0f0;
    }

    .order-number {
        font-size: 3.2vw;
        color: #999;
        font-family: 'Courier New', monospace;
    }

    .order-number span {
        color: #667eea;
        font-weight: bold;
    }

    .order-item-preview {
        display: flex;
        gap: 3vw;
        padding: 2.5vw 0;
        border-bottom: 1px solid #f8f8f8;
    }

    .order-item-preview:last-child {
        border-bottom: none;
    }

    .item-image-small {
        width: 18vw;
        height: 18vw;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-radius: 2vw;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .item-image-small span {
        font-size: 9vw;
        opacity: 0.5;
    }

    .item-info {
        flex: 1;
    }

    .item-name-small {
        font-size: 3.5vw;
        font-weight: 600;
        color: #333;
        margin-bottom: 1vw;
        line-height: 1.3;
    }

    .item-detail-small {
        font-size: 3vw;
        color: #999;
    }

    .item-price-small {
        font-size: 4vw;
        font-weight: bold;
        color: #e74c3c;
        margin-top: 1.5vw;
    }

    .order-footer {
        background: #f8f9fa;
        padding: 3.5vw;
        border-top: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .order-total-label {
        font-size: 3.8vw;
        color: #666;
    }

    .order-total-amount {
        font-size: 5.5vw;
        font-weight: bold;
        color: #333;
    }

    .order-actions {
        margin-top: 3vw;
        display: flex;
        gap: 2vw;
    }

    .btn-order-action {
        flex: 1;
        padding: 3vw;
        border-radius: 2vw;
        font-size: 3.5vw;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        border: none;
    }

    .btn-detail {
        background: white;
        color: #667eea;
        border: 1.5px solid #667eea;
    }

    .btn-reorder {
        background: #667eea;
        color: white;
    }

    .loading-container {
        text-align: center;
        padding: 10vw;
        font-size: 4vw;
        color: #999;
    }

    .more-items-badge {
        display: inline-block;
        background: #667eea;
        color: white;
        padding: 1vw 2.5vw;
        border-radius: 1.5vw;
        font-size: 3vw;
        font-weight: bold;
        margin-top: 2vw;
    }

    /* 태블릿 이상 */
    @media (min-width: 768px) {
        .filter-tabs {
            justify-content: center;
            padding: 10px 15px;
        }

        .filter-tab {
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 8px;
        }

        .order-card {
            max-width: 600px;
            margin: 20px auto;
            border-radius: 15px;
        }

        .order-date {
            font-size: 14px;
        }

        .order-status {
            font-size: 12px;
            padding: 6px 12px;
        }

        .order-number {
            font-size: 13px;
        }

        .item-image-small {
            width: 70px;
            height: 70px;
        }

        .item-image-small span {
            font-size: 36px;
        }

        .item-name-small {
            font-size: 14px;
        }

        .item-price-small {
            font-size: 16px;
        }

        .order-total-label {
            font-size: 15px;
        }

        .order-total-amount {
            font-size: 22px;
        }

        .btn-order-action {
            padding: 12px;
            font-size: 14px;
            border-radius: 8px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="orders-container">
    <!-- 필터 탭 -->
    <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterOrders('all')">전체</button>
        <button class="filter-tab" onclick="filterOrders('pending')">결제대기</button>
        <button class="filter-tab" onclick="filterOrders('confirmed')">주문확인</button>
        <button class="filter-tab" onclick="filterOrders('shipping')">배송중</button>
        <button class="filter-tab" onclick="filterOrders('delivered')">배송완료</button>
        <button class="filter-tab" onclick="filterOrders('cancelled')">취소</button>
    </div>

    <!-- 주문 목록 -->
    <div id="ordersContainer">
        <div class="loading-container">주문 내역을 불러오는 중...</div>
    </div>
</div>

<script>
let allOrders = [];
let currentFilter = 'all';

// 페이지 로드 시
window.addEventListener('DOMContentLoaded', loadOrders);

// 주문 내역 조회
async function loadOrders() {
    try {
        const response = await fetch('/mobile/api/orders');
        const data = await response.json();

        if (response.ok) {
            allOrders = data.orders;
            renderOrders();
        } else {
            showError(data.error || '주문 내역을 불러올 수 없습니다');
        }
    } catch (error) {
        console.error('Error:', error);
        showError('네트워크 오류가 발생했습니다');
    }
}

// 필터링
function filterOrders(status) {
    currentFilter = status;

    // 탭 활성화 상태 변경
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    event.target.classList.add('active');

    renderOrders();
}

// 주문 렌더링
function renderOrders() {
    const container = document.getElementById('ordersContainer');

    // 필터링
    let filteredOrders = allOrders;
    if (currentFilter !== 'all') {
        filteredOrders = allOrders.filter(order => order.order_status === currentFilter);
    }

    // 정렬 (최신순)
    filteredOrders.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    if (filteredOrders.length === 0) {
        container.innerHTML = `
            <div class="orders-empty">
                <div class="empty-icon">📦</div>
                <div class="empty-text">주문 내역이 없습니다</div>
                <a href="/mobile/search/" class="btn-go-shop">쇼핑하러 가기</a>
            </div>
        `;
        return;
    }

    let html = '';
    filteredOrders.forEach(order => {
        const statusText = getStatusText(order.order_status);
        const statusClass = `status-${order.order_status}`;

        html += `
            <div class="order-card">
                <div class="order-header">
                    <span class="order-date">${formatDate(order.created_at)}</span>
                    <span class="order-status ${statusClass}">${statusText}</span>
                </div>
                <div class="order-body">
                    <div class="order-number-section">
                        <span class="order-number">주문번호: <span>${order.order_number}</span></span>
                    </div>

                    ${renderOrderItems(order.items)}

                </div>
                <div class="order-footer">
                    <span class="order-total-label">총 결제 금액</span>
                    <span class="order-total-amount">₩${formatNumber(order.final_amount)}</span>
                </div>
                <div class="order-body">
                    <div class="order-actions">
                        <a href="/mobile/order/${order.id}/" class="btn-order-action btn-detail">상세보기</a>
                        <button class="btn-order-action btn-reorder" onclick="reorder(${order.id})">재주문</button>
                    </div>
                </div>
            </div>
        `;
    });

    container.innerHTML = html;
}

// 주문 항목 렌더링
function renderOrderItems(items) {
    let html = '';
    const maxDisplay = 3;  // 최대 3개까지만 표시

    items.slice(0, maxDisplay).forEach(item => {
        html += `
            <div class="order-item-preview">
                <div class="item-image-small">
                    <span>🛞</span>
                </div>
                <div class="item-info">
                    <div class="item-name-small">${item.product_name}</div>
                    <div class="item-detail-small">
                        ${item.product_code}
                        ${item.selected_year ? ` | DOT ${item.selected_year}년` : ''}
                        | ${item.quantity}개
                    </div>
                    <div class="item-price-small">₩${formatNumber(item.final_price * item.quantity)}</div>
                </div>
            </div>
        `;
    });

    // 더 많은 상품이 있는 경우
    if (items.length > maxDisplay) {
        html += `<span class="more-items-badge">+${items.length - maxDisplay}개 더보기</span>`;
    }

    return html;
}

// 상태 텍스트
function getStatusText(status) {
    const statusMap = {
        'pending': '결제대기',
        'confirmed': '주문확인',
        'preparing': '상품준비중',
        'shipping': '배송중',
        'delivered': '배송완료',
        'cancelled': '취소',
        'refunded': '환불완료'
    };
    return statusMap[status] || status;
}

// 재주문
async function reorder(orderId) {
    if (!confirm('이 주문의 상품을 장바구니에 담으시겠습니까?')) {
        return;
    }

    try {
        const response = await fetch(`/mobile/api/orders/${orderId}/reorder`, {
            method: 'POST'
        });

        const data = await response.json();

        if (response.ok) {
            alert('✅ 장바구니에 담았습니다');
            window.location.href = '/mobile/cart/';
        } else {
            alert('❌ ' + (data.error || '재주문 실패'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('네트워크 오류가 발생했습니다');
    }
}

// 에러 표시
function showError(message) {
    const container = document.getElementById('ordersContainer');
    container.innerHTML = `
        <div class="orders-empty">
            <div class="empty-icon">⚠️</div>
            <div class="empty-text">${message}</div>
        </div>
    `;
}

// 날짜 포맷팅
function formatDate(dateString) {
    const date = new Date(dateString);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    const hours = String(date.getHours()).padStart(2, '0');
    const minutes = String(date.getMinutes()).padStart(2, '0');
    return `${year}.${month}.${day} ${hours}:${minutes}`;
}

// 숫자 포맷팅
function formatNumber(num) {
    return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
</script>
{% endblock %}
