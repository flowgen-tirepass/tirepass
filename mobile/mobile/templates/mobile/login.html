<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>로그인 - TirePASS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .login-header {
            padding: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .login-container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            animation: slideUp 0.5s ease-out;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
        }

        .logo-icon {
            font-size: 40px;
        }

        .login-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            color: #666;
        }

        .warning-box {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: start;
            gap: 10px;
        }

        .warning-icon {
            color: #ff9800;
            font-size: 20px;
            flex-shrink: 0;
        }

        .warning-text {
            font-size: 13px;
            color: #856404;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f8f8;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .form-input::placeholder {
            color: #999;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .checkbox-input {
            width: 20px;
            height: 20px;
            accent-color: #667eea;
        }

        .checkbox-label {
            font-size: 14px;
            color: #666;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 1px;
            background: #e0e0e0;
        }

        .divider-text {
            background: white;
            padding: 0 15px;
            color: #999;
            font-size: 13px;
            position: relative;
        }

        .biometric-btn {
            width: 100%;
            padding: 14px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .biometric-btn:hover {
            background: #f8f8f8;
            border-color: #667eea;
            color: #667eea;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-text {
            font-size: 14px;
            color: #666;
        }

        .register-text a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-text a:hover {
            text-decoration: underline;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        {% if messages %}
            .messages {
                margin-bottom: 20px;
            }
        {% endif %}

        @media (max-width: 374px) {
            .login-card {
                padding: 25px 20px;
            }

            .login-title {
                font-size: 22px;
            }
        }

        @media (min-width: 768px) {
            .login-container {
                max-width: 450px;
            }
        }
    </style>
</head>
<body>
    <div class="login-header">
        <a href="{% url 'mobile_intro' %}" class="back-btn">←</a>
        <h1 class="header-title">로그인</h1>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logo-circle">
                    <span class="logo-icon">🛞</span>
                </div>
                <h2 class="login-title">TirePASS</h2>
                <p class="login-subtitle">B2B 타이어 전문 쇼핑몰</p>
            </div>

            <div class="warning-box">
                <span class="warning-icon">⚠️</span>
                <div class="warning-text">
                    <strong>최초 로그인 시 주의사항</strong><br>
                    초기 비밀번호는 사업자번호 10자리입니다.<br>
                    로그인 후 반드시 비밀번호를 변경해주세요.
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="error-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'mobile_login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="business_number" class="form-label">사업자번호</label>
                    <input type="text"
                           id="business_number"
                           name="business_number"
                           class="form-input"
                           placeholder="'-' 없이 10자리 숫자 입력"
                           maxlength="10"
                           pattern="[0-9]{10}"
                           required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-input"
                           placeholder="비밀번호 입력"
                           required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember_me" name="remember_me" class="checkbox-input">
                    <label for="remember_me" class="checkbox-label">자동 로그인</label>
                </div>

                <button type="submit" class="login-btn">로그인</button>
            </form>

            <div class="divider">
                <span class="divider-text">또는</span>
            </div>

            <button type="button" class="biometric-btn" onclick="alert('생체 인증 기능은 준비 중입니다.')">
                <span>🔐</span>
                <span>생체 인증으로 로그인</span>
            </button>

            <div class="register-link">
                <p class="register-text">
                    아직 회원이 아니신가요?
                    <a href="#">회원가입</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        // 사업자번호 자동 포맷팅
        const businessInput = document.getElementById('business_number');

        businessInput.addEventListener('input', function(e) {
            // 숫자만 남기기
            let value = e.target.value.replace(/[^0-9]/g, '');

            // 10자리 제한
            if (value.length > 10) {
                value = value.substr(0, 10);
            }

            e.target.value = value;
        });

        // 로컬 스토리지에서 저장된 사업자번호 불러오기
        window.addEventListener('load', function() {
            const savedNumber = localStorage.getItem('saved_business_number');
            const rememberCheckbox = document.getElementById('remember_me');

            if (savedNumber) {
                businessInput.value = savedNumber;
                rememberCheckbox.checked = true;
            }
        });

        // 폼 제출 시 자동 로그인 체크
        document.querySelector('form').addEventListener('submit', function(e) {
            const rememberCheckbox = document.getElementById('remember_me');

            if (rememberCheckbox.checked) {
                localStorage.setItem('saved_business_number', businessInput.value);
            } else {
                localStorage.removeItem('saved_business_number');
            }
        });
    </script>
</body>
</html>
