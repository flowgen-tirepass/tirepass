<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>비밀번호 변경 - TirePASS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            padding: 20px;
            color: white;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
        }

        .container {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 400px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .security-icon {
            text-align: center;
            margin-bottom: 25px;
        }

        .security-badge {
            width: 80px;
            height: 80px;
            background: #ff6b6b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 40px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: start;
        }

        .alert-icon {
            color: #ff9800;
            font-size: 20px;
            flex-shrink: 0;
        }

        .alert-text {
            font-size: 13px;
            color: #856404;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f8f8;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .password-requirements {
            background: #f0f0f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .requirement-title {
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 8px;
        }

        .requirement-list {
            list-style: none;
            padding: 0;
        }

        .requirement-item {
            font-size: 12px;
            color: #666;
            padding: 3px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .requirement-icon {
            color: #27ae60;
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .btn-secondary {
            width: 100%;
            padding: 14px;
            background: white;
            color: #666;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-secondary:hover {
            background: #f8f8f8;
            border-color: #667eea;
            color: #667eea;
        }

        .error-message {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .success-message {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .password-strength {
            height: 5px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 5px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            transition: width 0.3s ease, background-color 0.3s ease;
            border-radius: 3px;
        }

        .strength-weak { width: 33%; background: #ff6b6b; }
        .strength-medium { width: 66%; background: #ffa500; }
        .strength-strong { width: 100%; background: #27ae60; }

        @media (max-width: 374px) {
            .card {
                padding: 25px 20px;
            }
            .title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="header-title">비밀번호 변경</h1>
    </div>

    <div class="container">
        <div class="card">
            <div class="security-icon">
                <div class="security-badge">🔐</div>
            </div>

            <h2 class="title">새 비밀번호 설정</h2>
            <p class="subtitle">보안을 위해 강력한 비밀번호로 변경해주세요</p>

            <div class="alert">
                <span class="alert-icon">⚠️</span>
                <div class="alert-text">
                    최초 로그인 시 반드시 비밀번호를 변경해야 합니다.<br>
                    보안이 강화된 새로운 비밀번호를 설정해주세요.
                </div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="{% if message.tags == 'error' %}error-message{% else %}success-message{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" action="{% url 'mobile_change_password' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label for="current_password" class="form-label">현재 비밀번호</label>
                    <input type="password"
                           id="current_password"
                           name="current_password"
                           class="form-input"
                           placeholder="현재 비밀번호 입력"
                           required>
                </div>

                <div class="form-group">
                    <label for="new_password" class="form-label">새 비밀번호</label>
                    <input type="password"
                           id="new_password"
                           name="new_password"
                           class="form-input"
                           placeholder="새 비밀번호 입력"
                           minlength="8"
                           required>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm_password" class="form-label">새 비밀번호 확인</label>
                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           class="form-input"
                           placeholder="새 비밀번호 다시 입력"
                           minlength="8"
                           required>
                </div>

                <div class="password-requirements">
                    <div class="requirement-title">비밀번호 요구사항</div>
                    <ul class="requirement-list">
                        <li class="requirement-item">
                            <span class="requirement-icon">✓</span>
                            <span>최소 8자 이상</span>
                        </li>
                        <li class="requirement-item">
                            <span class="requirement-icon">✓</span>
                            <span>영문, 숫자 조합 권장</span>
                        </li>
                        <li class="requirement-item">
                            <span class="requirement-icon">✓</span>
                            <span>특수문자 포함 권장</span>
                        </li>
                    </ul>
                </div>

                <button type="submit" class="btn-primary">비밀번호 변경</button>
                <a href="{% url 'mobile_logout' %}" class="btn-secondary">나중에 변경</a>
            </form>
        </div>
    </div>

    <script>
        // 비밀번호 강도 체크
        const newPasswordInput = document.getElementById('new_password');
        const strengthBar = document.getElementById('strengthBar');

        newPasswordInput.addEventListener('input', function() {
            const password = this.value;
            let strength = 0;

            if (password.length >= 8) strength++;
            if (password.match(/[a-zA-Z]/) && password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;

            strengthBar.className = 'strength-bar';
            if (strength === 1) strengthBar.classList.add('strength-weak');
            else if (strength === 2) strengthBar.classList.add('strength-medium');
            else if (strength === 3) strengthBar.classList.add('strength-strong');
        });

        // 비밀번호 확인
        const confirmPasswordInput = document.getElementById('confirm_password');
        const form = document.querySelector('form');

        form.addEventListener('submit', function(e) {
            if (newPasswordInput.value !== confirmPasswordInput.value) {
                e.preventDefault();
                alert('새 비밀번호가 일치하지 않습니다.');
                confirmPasswordInput.focus();
            }
        });
    </script>
</body>
</html>
